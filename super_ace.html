<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ace Slot</title>

    <!-- Firebase Compat Support -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1a0f2e 0%, #06030a 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            overflow-y: auto;
            box-sizing: border-box;
            padding-top: 70px;
        }

        /* TOP NAVIGATION HEADER */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #110b1a;
            padding: 0 15px;
            border-bottom: 2px solid #d4af37;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .nav-title {
            font-size: 20px;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            letter-spacing: 1px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-balance {
            font-size: 16px;
            font-weight: bold;
            color: #2ecc71;
            background: #09060f;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #3d2c16;
            text-shadow: 0 1px 1px #000;
        }

        /* Free Spins HUD */
        .free-spins-hud {
            display: none;
            background: linear-gradient(90deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 900;
            text-align: center;
            padding: 8px;
            font-size: 16px;
            border-bottom: 2px solid #ffd700;

            letter-spacing: 1px;
        }

        /* Game Container */
        .game-container {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(180deg, #181124 0%, #0e0a16 100%);
            border-radius: 24px;

        /* Combo Multiplier Bar */
        .multiplier-bar {
            display: flex;
            justify-content: space-around;
            background: #0f081d;
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 6px;

        }

        .mult-step {
            font-size: 15px;
            font-weight: 900;
            color: #555;

        }

        .mult-step.active {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ff8f00;
            transform: scale(1.25);
        }

        /* Slot Board */
        .slot-board-wrapper {
            padding: 15px;
        }

        .slot-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background: #09060f;
            padding: 10px;
            border-radius: 14px;
            border: 2px solid #d4af37;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 0 15px #000;
            overflow: hidden;
            height: 420px; 
            box-sizing: border-box;
        }

        .reel-container {
            overflow: hidden;
            height: 100%;
            position: relative;
        }

        .reel-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transform: translateY(0);
        }

        .reel-column.spinning {
            animation: reelFall 0.1s linear infinite;
        }

        @keyframes reelFall {
            0% { transform: translateY(-101px); }
            100% { transform: translateY(0); }
        }

        /* Cards Style */
        .card-cell {
            height: 95px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 2px solid #ccc;
            box-shadow: 0 4px 6px rgba(0,0,0,0.25);
            position: relative;
            transition: all 0.2s;
        }

        /* Golden Card Styling */
        .card-cell.golden {
            border: 3px solid #ffd700 !important;
            background: linear-gradient(135deg, #ffffff 0%, #fff9be 100%) !important;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.7) !important;
        }

        .card-cell.golden::after {
            content: 'GOLD';
            position: absolute;
            bottom: 3px;
            font-size: 8px;
            font-weight: 900;
            color: #b28d00;
            background: rgba(255, 215, 0, 0.2);
            padding: 1px 3px;
            border-radius: 3px;
        }

        .symbol-label {
            font-size: 14px;
            font-weight: bold;
            position: absolute;
            top: 4px;
            left: 6px;
        }

        .symbol-icon {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Winning Card Highlight */
        .card-cell.win-highlight {
            border: 3px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px #ff007f;
            animation: pulseGlow 0.4s infinite alternate;
            z-index: 5;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Symbol colors */
        .sym-A { color: #d47a00; } 
        .sym-K { color: #0f4c81; } 
        .sym-Q { color: #d63031; } 
        .sym-J { color: #1e7e34; } 
        .sym-S { color: #1e272e; } /* Spade ♠ */
        .sym-H { color: #d63031; } /* Heart ♥ */
        .sym-C { color: #16a085; } /* Club ♣ */
        .sym-D { color: #e67e22; } /* Diamond ♦ */
        .sym-W { color: #9b59b6; font-weight: 900; } /* Wild/Joker 🃏 */
        .sym-SC { color: #f1c40f; font-weight: 900; } /* Scatter 🪙 */

        /* Floating Win Overlay */
        .floating-win {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);

            text-align: center;

            box-shadow: 0 0 30px rgba(255, 202, 40, 0.6);
            z-index: 100;
            pointer-events: none;
            opacity: 0;

        .floating-win.pop-up {
            animation: winPopAndDisappear 1.6s ease-out forwards;

        @keyframes winPopAndDisappear {
            0% { transform: translate(-50%, -20%) scale(0.6); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            25% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }
            80% { transform: translate(-50%, -55%) scale(1.0); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(0.7); opacity: 0; }
        }

        .control-wrapper {
            padding: 0 15px 15px 15px;

            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;

        }

        .btn-adjust:hover {

        }

        .bet-display {
            width: 60px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
        }

        .btn-spin {

            color: #0d0614;
            border: none;
            padding: 12px;

        .message-box {

            min-height: 20px;

            text-align: center;
        }

        /* APP THEMED MODAL SYSTEM WITH TABS */
        .custom-modal-overlay {

            top: 0;
            left: 0;

        .close-modal-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            color: #ffd700;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10;
        }

        .modal-tabs {

            justify-content: space-around;
            border-bottom: 2px solid #311b4e;
            margin-bottom: 15px;
            padding-bottom: 5px;

        .modal-tab {
            background: none;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: bold;
            padding: 10px;

            flex-grow: 1;
            text-align: center;
            transition: all 0.2s;

            color: #ffd700;

            text-shadow: 0 0 5px rgba(255, 215, 0, 0.4);
        }

        .modal-title {
            margin-top: 0;
            color: #ffd700;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            border-bottom: 2px solid #311b4e;
            padding-bottom: 10px;
            display: none;
        }

        .modal-body {
            font-size: 14px;
            line-height: 1.6;
            max-height: 320px;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }

        .modal-body::-webkit-scrollbar {
            width: 6px;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 3px;
        }

        /* Bet History Table Style */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }

        .history-table th {
            color: #d4af37;
            border-bottom: 2px solid #311b4e;
            padding: 8px 4px;
            font-weight: 900;
        }

        .history-table td {
            border-bottom: 1px solid #1f1435;
            padding: 8px 4px;
        }

        /* Rules View & Paytable Style */
        .paytable-rules {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            overflow: hidden;

        }

        .paytable-rules th {
            background: #25183a;
            color: #ffd700;
            padding: 6px;
        }

        .paytable-rules td {
            padding: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

.wheel-3d-container {
    height: 60px;
    position: relative;
    background: #06030a;
    border-radius: 12px;
    perspective: 1000px; /* 3D ইফেক্ট */
    overflow: hidden;
}

.wheel-3d-scroll {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

.wheel-3d-scroll::-webkit-scrollbar { display: none; }

.wheel-item-3d {
    height: 60px;
    line-height: 60px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #ffd700;
    scroll-snap-align: center;
    transition: all 0.3s ease;
    /* 3D এবং ঝাপসা ইফেক্ট */
    transform: rotateX(0deg);
    opacity: 0.3; 
}

/* যেটা সিলেক্ট হবে */
.wheel-item-3d.active {
    opacity: 1;
    transform: scale(1.3);
    text-shadow: 0 0 10px #ffd700;
}
    </style>

<div class="top-nav">

<script>
    // Symbols configs conforming to Super Ace Paytable rules
    const SYMBOLS = [
        { name: 'A', label: 'A', icon: 'A', colorClass: 'sym-A', weight: 1.5 },
        { name: 'K', label: 'K', icon: 'K', colorClass: 'sym-K', weight: 1.8 },
        { name: 'Q', label: 'Q', icon: 'Q', colorClass: 'sym-Q', weight: 2.0 },
        { name: 'J', label: 'J', icon: 'J', colorClass: 'sym-J', weight: 2.2 },
        { name: 'S', label: '♠', icon: '♠', colorClass: 'sym-S', weight: 3.0 }, // Spade
        { name: 'H', label: '♥', icon: '♥', colorClass: 'sym-H', weight: 3.0 }, // Heart
        { name: 'C', label: '♣', icon: '♣', colorClass: 'sym-C', weight: 3.5 }, // Club
        { name: 'D', label: '♦', icon: '♦', colorClass: 'sym-D', weight: 3.5 }, // Diamond
        { name: 'W', label: 'WILD', icon: '🃏', colorClass: 'sym-W', weight: 0.3 }, // Joker/Wild (Rare)
        { name: 'SC', label: 'SCATTER', icon: '🪙', colorClass: 'sym-SC', weight: 0.5 } // Scatter (Rare)
    ];

    let balance = 0.00; // Database synchronized balance
    let currentBet = 3;
    const minBet = 3;
    let isSpinning = false;
    let audioCtx = null;

    // Super Ace Rules Parameters
    let isFreeGame = false;
    let freeSpinsLeft = 0;
    let comboMultiplierStep = 1; // 1, 2, 3, 4
    let currentSpinTotalWin = 0;
    let totalFreeSpinsWin = 0;

    // Bet history system
    let betHistory = [];
    let isFreeGameTriggeredThisTurn = false;

    // Long press bet adjuster
    let holdTimeout = null;
    let holdInterval = null;

    // FIREBASE & DATABASE SYNC IMPLEMENTATION (No hardcoded credentials)
    let db = null;
    let currentUser = null;

    // Self-Balancing RTP Pool state variables
    let gameSettings = { chance: 35, target_rtp: 80 }; // Default values
    let poolData = { total_in: 1000, total_out: 750 }; // Baseline to prevent division-by-zero
    let forceLossThisSpin = false;

let betStep = 1; // এখন থেকে এটি চাকার মান অনুযায়ী আপডেট হবে
const stepWheel = document.getElementById('stepWheel');

// ১ থেকে ১০০ পর্যন্ত চাকা তৈরি
for (let i = 1; i <= 100; i++) {
    const div = document.createElement('div');
    div.className = 'wheel-item-3d';
    div.textContent = `+ ${i}`;
    div.dataset.step = i;
    if(i === 1) div.classList.add('active'); // ডিফল্ট ১
    stepWheel.appendChild(div);
}

// স্ক্রল লজিক
stepWheel.addEventListener('scroll', () => {
    const items = document.querySelectorAll('.wheel-item-3d');
    let closestItem = null;
    let minDistance = Infinity;

    items.forEach(item => {
        const rect = item.getBoundingClientRect();
        const containerRect = stepWheel.getBoundingClientRect();
        const distance = Math.abs(rect.top - containerRect.top);

        if (distance < minDistance) {
            minDistance = distance;
            closestItem = item;
        }

        item.classList.remove('active');
    });

    if (closestItem) {
        closestItem.classList.add('active');
        betStep = parseInt(closestItem.dataset.step); // আপনার প্লাস-মাইনাস বাটনে এখন এই মান ব্যবহার হবে
    }
});

// আপনার আগের adjustBetOnce ফাংশনটি এভাবে আপডেট করুন:
function adjustBetOnce(direction) {
    if (direction === 1) {
        currentBet += betStep; // এখন সরাসরি betStep অনুযায়ী বাড়বে
    } else if (direction === -1) {
        if (currentBet - betStep >= minBet) {
            currentBet -= betStep; // এখন সরাসরি betStep অনুযায়ী কমবে
        } else {
            currentBet = minBet;
        }
    }
    updateUI();
}
    function initFirebaseSync() {
        // dynamic config pulling
        const savedConfig = localStorage.getItem('firebase_config');
        
        if (savedConfig && typeof firebase !== 'undefined') {
            try {
                const configObj = JSON.parse(savedConfig);
                if (!firebase.apps.length) {
                    firebase.initializeApp(configObj);
                }
                
                db = firebase.firestore();

                // ১. লাইভ গেম প্রফিট/লস পুল এবং সেটিংসের লিসেনার (Realtime Listeners)
                db.collection("settings").doc("game_config").onSnapshot(d => {
                    if (d.exists) {
                        gameSettings = d.data();
                        if (!gameSettings.target_rtp) gameSettings.target_rtp = 80; // default company profit 20%
                    }
                });

                db.collection("settings").doc("game_pool").onSnapshot(d => {
                    if (d.exists) {
                        poolData = d.data();
                    }
                });

                // ২. ইউজার অথেনটিকেশন ও ব্যালেন্স লিসেনার
                firebase.auth().onAuthStateChanged((user) => {
                    if (user) {
                        currentUser = user;
                        db.collection("users").doc(user.uid).onSnapshot((doc) => {
                            if (doc.exists) {
                                const data = doc.data();
                                balance = parseFloat(data.balance) || 0;
                                updateUI();
                                document.getElementById('btnSpin').disabled = isSpinning;
                                messageBox.textContent = isSpinning ? messageBox.textContent : "স্পিন বাটনে চাপ দিয়ে খেলা শুরু করুন";
                            }
                        }, (error) => {
                            console.error("Firestore balance sync error:", error);
                            fallbackToLocalStorage();
                        });
                    } else {
                        fallbackToLocalStorage();
                    }
                });
            } catch (err) {
                console.warn("Firebase Init Fallback Error:", err);
                fallbackToLocalStorage();
            }
        } else {
            fallbackToLocalStorage();
        }
    }

    function fallbackToLocalStorage() {
        // Local testing / simulation mode
        const localBal = localStorage.getItem('user_balance');
        balance = localBal ? parseFloat(localBal) : 500.00;
        
        const localIn = localStorage.getItem('local_pool_in');
        const localOut = localStorage.getItem('local_pool_out');
        poolData.total_in = localIn ? parseFloat(localIn) : 1000;
        poolData.total_out = localOut ? parseFloat(localOut) : 750;

        updateUI();
        document.getElementById('btnSpin').disabled = isSpinning;
        messageBox.textContent = "স্পিন বাটনে চাপ দিয়ে খেলা শুরু করুন (Test Mode)";
    }

    // ডেটাবেজের রিয়েলটাইম ব্যালেন্স আপডেট করার ফাংশন
    async function writeDatabaseBalance(newBalance) {
        balance = newBalance;
        updateUI();
        
        if (currentUser && db) {
            try {
                await db.collection('users').doc(currentUser.uid).update({
                    balance: parseFloat(newBalance.toFixed(2))
                });
            } catch (error) {
                console.error("Error writing balance to Database:", error);
            }
        } else {
            localStorage.setItem('user_balance', newBalance.toFixed(2));
        }
    }

    // গ্লোবাল কোম্পানি পুল ব্যালেন্স আপডেট করার ফাংশন
    async function updateGamePool(type, amount) {
        const increment = firebase.firestore.FieldValue.increment;
        if (currentUser && db) {
            try {
                const updatePayload = {};
                if (type === 'in') {
                    updatePayload.total_in = increment(amount);
                } else if (type === 'out') {
                    updatePayload.total_out = increment(amount);
                }
                await db.collection("settings").doc("game_pool").set(updatePayload, { merge: true });
            } catch (err) {
                console.error("Error updating FireStore Game Pool:", err);
            }
        } else {
            // Local fallback simulation
            if (type === 'in') {
                poolData.total_in += amount;
                localStorage.setItem('local_pool_in', poolData.total_in);
            } else {
                poolData.total_out += amount;
                localStorage.setItem('local_pool_out', poolData.total_out);
            }
        }
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playStartSound() {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    function playSpinTick() {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.setValueAtTime(160, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    function playStopSound() {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function playWinSound() {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.15, now + idx * 0.1);
            gain.gain.linearRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.4);
        });
    }

    // আরটিপি কন্ট্রোল্ড র্যান্ডম সিম্বল জেনারেটর (RTP Controlled Engine)
    function getRandomSymbol(col) {
        // ফোর্সড-লস সক্রিয় থাকলে এবং এটি ফ্রি গেম না হলে, কোনো মিল না থাকার গ্যারান্টি দিতে বিশেষ প্যাটার্ন জেনারেট করা হবে
        if (forceLossThisSpin && !isFreeGame) {
            // রিল ১, ৩ এবং ৫ এর জন্য একসেট প্রতীক এবং ২ এবং ৪ এর জন্য ভিন্ন সেট ব্যবহার করা হবে। এতে ৩টি মিল অসম্ভব হয়।
            const setA = ['A', 'Q', 'S', 'C'];
            const setB = ['K', 'J', 'H', 'D'];
            const activeSet = (col === 0 || col === 2 || col === 4) ? setA : setB;
            const chosenName = activeSet[Math.floor(Math.random() * activeSet.length)];
            const matchSymbol = SYMBOLS.find(s => s.name === chosenName);
            
            return {
                name: matchSymbol.name,
                label: matchSymbol.label,
                icon: matchSymbol.icon,
                colorClass: matchSymbol.colorClass,
                isGolden: false // ফোর্সড লস মোডে গোল্ডেন কার্ড নিষিদ্ধ
            };
        }

        // সাধারণ অবস্থায় র্যান্ডম জেনারেশন
        const totalWeight = SYMBOLS.reduce((sum, s) => sum + s.weight, 0);
        let rand = Math.random() * totalWeight;
        let picked = SYMBOLS[0];
        
        for (const s of SYMBOLS) {
            if (rand < s.weight) {
                picked = s;
                break;
            }
            rand -= s.weight;
        }

        let sym = { ...picked };
        sym.isGolden = false;

        // গোল্ডেন কার্ড রুল: কেবল রিল ২, ৩ এবং ৪ এ (ফোর্সড লস ছাড়া) গোল্ডেন কার্ড আসতে পারবে
        const eligibleGolden = ['A', 'K', 'Q', 'J', 'S', 'H', 'C', 'D'];
        if ((col === 1 || col === 2 || col === 3) && eligibleGolden.includes(sym.name)) {
            if (Math.random() < 0.25) { 
                sym.isGolden = true;
            }
        }
        return sym;
    }

        adjustBetOnce(direction);
        holdTimeout = setTimeout(() => {

                adjustBetOnce(direction);
            }, 80);
        }, 400);
    }

        clearTimeout(holdTimeout);
        clearInterval(holdInterval);
    }

    function adjustBetOnce(direction) {
    if (direction === 1) {
        currentBet += betStep;
    } else if (direction === -1) {
        // সর্বনিম্ন বেট minBet (৩) এর নিচে নামবে না
        if (currentBet - betStep >= minBet) {
            currentBet -= betStep;
        } else {
            currentBet = minBet;
        }
    }
    updateUI();
}

    function startSpin(isFree) {
        winOverlay.classList.remove('pop-up');
        playStartSound();

        isSpinning = true;
        btnSpin.disabled = true;
        btnBuyBonus.disabled = true;
        btnMinus.disabled = true;

        messageBox.textContent = isFree ? "ফ্রি স্পিন ঘুরছে..." : "ভাগ্যের চাকা ঘুরছে...";

        comboMultiplierStep = 1;
        currentSpinTotalWin = 0;
        isFreeGameTriggeredThisTurn = false;
        renderMultiplierBar();

        // আরটিপি অ্যালগরিদম ট্রিগার (RTP Balance Guard)
        // ১. রিয়েলটাইম Actual RTP নির্ধারণ
        const actualRtp = poolData.total_in > 0 ? (poolData.total_out / poolData.total_in) * 100 : 0;
        
        // ২. যদি বর্তমান আরটিপি অ্যাডমিনের সেট করা টার্গেট আরটিপি (যেমন ৮০%) পার করে যায়, তবে গ্যারান্টিড লস দেওয়া হবে
        if (actualRtp > gameSettings.target_rtp && !isFreeGame) {
            forceLossThisSpin = true;
        } else {
            // টার্গেটের মধ্যে থাকলে অ্যাডমিন চান্স প্রোব্যাবিলিটি কাজ করবে (Win Chance)
            const randomRoll = Math.random() * 100;
            forceLossThisSpin = (randomRoll >= gameSettings.chance) && !isFreeGame;
        }

        const columns = document.querySelectorAll('.reel-column');
        columns.forEach((col) => {
            col.classList.add('spinning');
        });

        let soundTimer = setInterval(() => {
            if (isSpinning) playSpinTick();
        }, 120);

        const delays = [800, 1100, 1400, 1700, 2000];
        delays.forEach((delay, colIndex) => {
            setTimeout(() => {
                stopReel(colIndex);
                if (colIndex === 4) {
                    clearInterval(soundTimer);
                    evaluateSpin();
                }
            }, delay);
        });
    }

    function stopReel(colIndex) {
        const colEl = document.getElementById(`reel-${colIndex}`);
        colEl.classList.remove('spinning');
        colEl.innerHTML = '';
        
        let colData = [];
        for (let row = 0; row < 4; row++) {
            const symbol = getRandomSymbol(colIndex);
            const cellEl = createCellElement(symbol);
            colEl.appendChild(cellEl);
            colData.push(symbol);
        }
        gridData[colIndex] = colData;
        playStopSound();
    }

    // 1024 Ways Payline Evaluator with Golden Cards & Cascade
    function evaluateSpin() {
        let winningCoords = [];
        let totalTurnWin = 0;

        const paytable = {
            'A': [0.25, 0.75, 1.25], // 3, 4, 5 consecutive reels
            'K': [0.20, 0.60, 1.00],
            'Q': [0.15, 0.45, 0.75],
            'J': [0.10, 0.30, 0.50],
            'S': [0.05, 0.15, 0.25], // Spade
            'H': [0.05, 0.15, 0.25], // Heart
            'C': [0.025, 0.075, 0.125], // Club
            'D': [0.025, 0.075, 0.125]  // Diamond
        };

        const symbolsToTest = ['A', 'K', 'Q', 'J', 'S', 'H', 'C', 'D'];

        // Evaluate each regular symbol for left-to-right connections
        symbolsToTest.forEach((sym) => {
            let counts = [0, 0, 0, 0, 0];
            let matchingIndices = [[], [], [], [], []];

            for (let col = 0; col < 5; col++) {
                for (let row = 0; row < 4; row++) {
                    let cell = gridData[col][row];
                    if (cell.name === sym || cell.name === 'W') {
                        counts[col]++;
                        matchingIndices[col].push({ col, row });
                    }
                }
            }

            if (counts[0] > 0 && counts[1] > 0 && counts[2] > 0) {
                let matchLength = 3;
                if (counts[3] > 0) {
                    matchLength = 4;
                    if (counts[4] > 0) {
                        matchLength = 5;
                    }
                }

                let ways = 1;
                for (let i = 0; i < matchLength; i++) {
                    ways *= counts[i];
                }

                const basePay = paytable[sym][matchLength - 3];
                const winValue = currentBet * basePay * ways;
                totalTurnWin += winValue;

                for (let i = 0; i < matchLength; i++) {
                    matchingIndices[i].forEach(coord => {
                        if (!winningCoords.some(c => c.col === coord.col && c.row === coord.row)) {
                            winningCoords.push(coord);
                        }
                    });
                }
            }
        });

        const activeMultValue = getActiveMultiplier();
        const TurnWinScaled = totalTurnWin * activeMultValue;

        if (TurnWinScaled > 0) {
            currentSpinTotalWin += TurnWinScaled;

            winningCoords.forEach((coord) => {
                const colEl = document.getElementById(`reel-${coord.col}`);
                if (colEl && colEl.children[coord.row]) {
                    colEl.children[coord.row].classList.add('win-highlight');
                }
            });

            messageBox.textContent = `লাইন মিলেছে! গুণক: x${activeMultValue} | জয়: ৳${TurnWinScaled.toFixed(2)}`;
            playWinSound();

            setTimeout(() => {
                winningCoords.forEach((coord) => {
                    const colEl = document.getElementById(`reel-${coord.col}`);
                    if (colEl && colEl.children[coord.row]) {
                        colEl.children[coord.row].classList.remove('win-highlight');
                    }
                });

                performCascade(winningCoords);

                if (comboMultiplierStep < 4) {
                    comboMultiplierStep++;
                }
                renderMultiplierBar();

                evaluateSpin();

            }, 1200);

        } else {
            let scatterCount = 0;
            for (let col = 0; col < 5; col++) {
                for (let row = 0; row < 4; row++) {
                    if (gridData[col][row].name === 'SC') {
                        scatterCount++;
                    }
                }
            }
            finalizeTurn(scatterCount);
        }
    }

    function performCascade(winningCoords) {
        winningCoords.forEach((coord) => {
            let cell = gridData[coord.col][coord.row];
            if (cell.isGolden) {
                gridData[coord.col][coord.row] = { name: 'W', label: 'WILD', icon: '🃏', colorClass: 'sym-W', isGolden: false };
            } else {
                gridData[coord.col][coord.row] = getRandomSymbol(coord.col);
            }
        });
        renderGridFromData();
    }

    function finalizeTurn(scatterCount) {
        let gotFreeSpins = false;
        let addedCount = 0;

        if (scatterCount >= 3) {
            gotFreeSpins = true;
            isFreeGameTriggeredThisTurn = true;
            if (!isFreeGame) {
                isFreeGame = true;
                freeSpinsLeft = 10;
                totalFreeSpinsWin = 0;
                addedCount = 10;
            } else {
                freeSpinsLeft += 5;
                addedCount = 5;
            }
        }

        // Add regular logs to Bet History
        if (freeSpinsLeft > 0 && isFreeGame && !isFreeGameTriggeredThisTurn) {
            recordLog("ফ্রি স্পিন", 0, currentSpinTotalWin);
        } else if (!isFreeGame && !isFreeGameTriggeredThisTurn) {
            recordLog("নরমাল স্পিন", currentBet, currentSpinTotalWin);
        }

        if (currentSpinTotalWin > 0) {
            // Write wins to database real-time balance and company pool
            writeDatabaseBalance(balance + currentSpinTotalWin);
            updateGamePool('out', currentSpinTotalWin);

            if (isFreeGame) {
                totalFreeSpinsWin += currentSpinTotalWin;
            }
            winOverlay.textContent = `৳${currentSpinTotalWin.toFixed(2)} WIN!`;
            winOverlay.classList.remove('pop-up');
            void winOverlay.offsetWidth;
            winOverlay.classList.add('pop-up');

            messageBox.textContent = `দারুণ! আপনি মোট ৳${currentSpinTotalWin.toFixed(2)} জিতেছেন।`;
            updateUI();
        } else {
            messageBox.textContent = isFreeGame ? "ফ্রি স্পিন চলছে..." : "আবার চেষ্টা করুন!";
        }

        if (gotFreeSpins) {
            setTimeout(() => {
                showNotification("অভিনন্দন! 🎉", `আপনি <strong>${addedCount}টি ফ্রি স্পিন</strong> পেয়েছেন! ফ্রি গেম উইন্ডো শুরু হচ্ছে...`);
                freeSpinsHud.style.display = 'block';
                freeSpinsCountEl.textContent = freeSpinsLeft;
                renderMultiplierBar();
                nextActionCycle();
            }, 1000);
        } else {
            nextActionCycle();
        }
    }

    function nextActionCycle() {
        if (isFreeGame) {
            if (freeSpinsLeft > 0) {
                setTimeout(() => {
                    freeSpinsLeft--;
                    freeSpinsCountEl.textContent = freeSpinsLeft;
                    startSpin(true);
                }, 2000);
            } else {
                setTimeout(() => {
                    showNotification("ফ্রি গেম শেষ! 🏆", `অভিনন্দন! আপনি ফ্রি গেমে মোট <strong>৳${totalFreeSpinsWin.toFixed(2)}</strong> জিতেছেন।`);
                    isFreeGame = false;
                    freeSpinsHud.style.display = 'none';
                    comboMultiplierStep = 1;
                    renderMultiplierBar();
                    restoreControls();
                }, 1000);
            }
        } else {
            restoreControls();
        }
    }

    function restoreControls() {
        isSpinning = false;
        btnSpin.disabled = false;
        btnBuyBonus.disabled = false;
        btnMinus.disabled = false;
        btnPlus.disabled = false;
        comboMultiplierStep = 1;
        forceLossThisSpin = false;
        renderMultiplierBar();
        updateUI();
    }

    // ফিজিক্যাল মোবাইল ব্যাক বাটন ইন্টারসেপ্ট করার মেকানিজম (History Loop Fix)
    window.history.pushState({page: "super_ace_active"}, "", "");
    window.onpopstate = function(event) {
        window.location.replace('index.html');
    };

    createGrid();
    initFirebaseSync();
</script>
