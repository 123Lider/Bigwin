<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Casino - Premium Pachinko</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <!-- ====== ADDED FIREBASE SCRIPTS ====== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0; padding: 0; background-color: #050505; color: white;
            font-family: 'Montserrat', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
        }

        /* Top Header */
        .header {
            position: absolute; top: 20px; width: 100%; max-width: 450px;
            display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box;
            z-index: 100;
        }
        .info-box {
            background: rgba(0, 0, 0, 0.9); border: 2px solid #c257ab; padding: 5px 15px;
            border-radius: 8px; text-align: center; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .info-box span { color: #fce45e; font-size: 15px; font-weight: 900; display: block; }

        /* Game Wrapper */
        .game-wrapper {
            width: 100%; display: flex; justify-content: center; align-items: center;
            padding: 20px; transform: scale(0.95);
        }

        /* Main Pachinko Board */
        .board-container {
            position: relative; width: 100%; max-width: 400px; height: 75vh;
            background: linear-gradient(to bottom, #002b10, #005922, #002b10);
            border: 6px solid #d4af37; border-radius: 12px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 15px 40px rgba(0,0,0,0.8), 0 0 25px rgba(212, 175, 55, 0.4);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Top Drop Zone */
        .drop-zone-area {
            position: relative; width: 100%; height: 45px;
            background: rgba(0,0,0,0.6); border-bottom: 2px solid #fff;
            display: flex; align-items: flex-end;
        }
        
        /* Light Box & Jilik Milik Animation */
        .light-box {
            position: absolute; top: 5px; left: 0px; width: 35px; height: 35px;
            background: #fff; box-shadow: 0 0 10px #fff;
            border-radius: 4px; transition: left 0.5s ease-in-out;
        }

        @keyframes jilikMilik {
            0% { opacity: 1; filter: brightness(1.5); box-shadow: 0 0 25px #fff, 0 0 40px #fce45e; }
            50% { opacity: 0.3; filter: brightness(0.8); box-shadow: none; }
            100% { opacity: 1; filter: brightness(1.5); box-shadow: 0 0 25px #fff, 0 0 40px #fce45e; }
        }
        .light-box.moving {
            animation: jilikMilik 0.25s infinite; 
        }
        .light-box.stopped {
            box-shadow: 0 0 15px #fff, 0 0 30px #fce45e; 
        }

        /* Middle Area: Pegs */
        .pegs-area {
            position: relative; flex: 1; width: 100%; overflow: hidden;
        }
        .peg {
            position: absolute; width: 6px; height: 6px;
            background: #fff; border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 10px #0f0;
            transform: translate(-50%, -50%);
        }

        /* Puck (সাদা বল) */
        .puck {
            position: absolute; width: 16px; height: 16px;
            background: radial-gradient(circle at 35% 35%, #ffffff, #cccccc, #777777);
            border-radius: 50%; box-shadow: 0 6px 12px rgba(0,0,0,0.9), inset -2px -2px 5px rgba(0,0,0,0.4);
            z-index: 50; display: none; 
            transform: translate(-50%, -50%);
        }

        /* Bottom Slots Area */
        .slots-area {
            position: relative; width: 100%; height: 110px;
            display: flex; border-top: 3px solid #d4af37;
            background: rgba(0, 0, 0, 0.8);
        }
        
        .slot {
            width: 6.25%; 
            flex: none; 
            border-right: 1px dashed rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: flex-end;
            padding-bottom: 5px; box-sizing: border-box; transition: background 0.3s;
        }
        .slot:last-child { border-right: none; }
        
        .stacked-text {
            display: flex; flex-direction: column; align-items: center;
            font-size: 13px; font-weight: 900; color: #fce45e;
            text-shadow: 1px 1px 3px #000; line-height: 0.9;
        }
        .stacked-text span { display: block; }
        
        .slot.highlight { background: rgba(252, 228, 94, 0.3); box-shadow: inset 0 -20px 40px rgba(252, 228, 94, 0.6); z-index: 10; }
        .slot.highlight .stacked-text { color: #fff; text-shadow: 0 0 10px #fce45e; }

        .overlay-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 35px; font-weight: 900; color: #0f0; text-shadow: 0 5px 20px #000;
            z-index: 200; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; width: 100%;
        }
        .overlay-msg.show { transform: translate(-50%, -50%) scale(1); }

    </style>
</head>
<body>

    <div class="header">
        <div class="info-box">Your Bet <span id="bet-amount">৳0</span></div>
        <div class="info-box">Balance <span id="balance">৳0</span></div>
    </div>

    <div class="game-wrapper">
        <div class="board-container">
            <!-- Top Box -->
            <div class="drop-zone-area" id="drop-zone-area">
                <div class="light-box" id="light-box"></div>
            </div>

            <!-- Pegs & Puck Area -->
            <div class="pegs-area" id="pegs-area">
                <div class="puck" id="puck"></div>
            </div>

            <!-- Bottom Slots -->
            <div class="slots-area" id="slots-container"></div>
            
            <div class="overlay-msg" id="overlay-msg"></div>
        </div>
    </div>

<script>
    // ==========================================
    // FIREBASE AUTH & SETUP
    // ==========================================
    const firebaseConfig = { apiKey: "AIzaSyB2Gv7FXkDP5AJEm2MrZBEin6rN8YZwnK8", authDomain: "betbd-be722.firebaseapp.com", projectId: "betbd-be722" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth(); 

    let currentUser = null;
    auth.onAuthStateChanged(user => {
        if(user) { currentUser = user; } 
        else { window.location.href = 'index.html'; }
    });

    // ==========================================
    // 1. DATA CONNECTION & MULTIPLIER LOGIC
    // ==========================================
    let betAmount = parseInt(localStorage.getItem('crazy_pa_bet')) || 0;
    let balance = parseFloat(localStorage.getItem('crazy_balance')) || 0;
    
    // মেইন গেম থেকে Top Slot Multiplier (Spin X) নিয়ে আসা
    let topSlotMulti = parseInt(localStorage.getItem('crazy_top_slot_multi')) || 1;

    document.getElementById('bet-amount').innerText = `৳${betAmount}`;
    document.getElementById('balance').innerText = `৳${balance}`;

    // এডমিন লিস্ট (Base Values)
    let baseSlots = [5, 10, 5, 20, 10, 'DOUBLE', 5, 50, 10, 'TRIPLE', 5, 25, 10, 5, 100, 5];
    
    // Top Slot (Spin X) এর গুণফল বসানো
    let ADMIN_SLOTS = baseSlots.map(val => {
        if (val === 'DOUBLE' || val === 'TRIPLE') return val;
        return val * topSlotMulti; 
    });
    
    let ADMIN_START_ZONE = Math.floor(Math.random() * 16); 
    let ADMIN_TARGET_SLOT = Math.floor(Math.random() * 16); 

    const totalCols = 16;
    const slotsContainer = document.getElementById('slots-container');
    const lightBox = document.getElementById('light-box');
    const pegsArea = document.getElementById('pegs-area');
    const overlayMsg = document.getElementById('overlay-msg');

    // ==========================================
    // RENDER SLOTS & PEGS
    // ==========================================
    function renderSlots() {
        slotsContainer.innerHTML = '';
        ADMIN_SLOTS.forEach(val => {
            let div = document.createElement('div');
            div.className = 'slot';
            
            let str = val.toString();
            if (val !== 'DOUBLE' && val !== 'TRIPLE') {
                str += 'x'; 
            }

            let htmlContent = '';
            for (let i = 0; i < str.length; i++) {
                htmlContent += `<span>${str[i]}</span>`;
            }

            let textContainer = document.createElement('div');
            textContainer.className = 'stacked-text';
            textContainer.innerHTML = htmlContent;
            
            if (val === 'DOUBLE' || val === 'TRIPLE') {
                textContainer.style.color = '#fff';
            }

            div.appendChild(textContainer);
            slotsContainer.appendChild(div);
        });
    }

    const rows = 12; 
    function drawPegs() {
        pegsArea.innerHTML = '<div class="puck" id="puck"></div>'; 
        let areaWidth = pegsArea.clientWidth;
        let areaHeight = pegsArea.clientHeight;
        let colWidth = areaWidth / totalCols;
        let rowHeight = areaHeight / rows;

        for (let r = 1; r < rows; r++) {
            let isOffset = r % 2 !== 0; 
            let colsInRow = isOffset ? totalCols + 1 : totalCols;
            
            for (let c = 0; c < colsInRow; c++) {
                let peg = document.createElement('div');
                peg.className = 'peg';
                
                let x = c * colWidth;
                if (isOffset) x -= colWidth / 2;
                else x += colWidth / 2;

                peg.style.left = `${x}px`;
                peg.style.top = `${r * rowHeight}px`;
                pegsArea.appendChild(peg);
            }
        }
    }

    renderSlots(); drawPegs();

    // ==========================================
    // PATH GENERATOR & GAME ANIMATION
    // ==========================================
    function generatePath(startIdx, targetIdx, totalRows) {
        let path = [startIdx];
        let current = startIdx;
        
        for(let i = 0; i < totalRows; i++) {
            let stepsLeft = totalRows - i - 1;
            let distToTarget = targetIdx - current;

            if (Math.abs(distToTarget) >= stepsLeft) {
                current += Math.sign(distToTarget);
            } else {
                let dir = Math.random() > 0.5 ? 1 : -1;
                if (current + dir < 0) dir = 1;
                if (current + dir > 15) dir = -1;
                current += dir;
            }
            path.push(current);
        }
        path[path.length - 1] = targetIdx; 
        return path;
    }

    function startPachinkoGame() {
        const puckEl = document.getElementById('puck');
        puckEl.style.display = 'none';
        
        lightBox.classList.add('moving');
        lightBox.classList.remove('stopped');
        
        let areaWidth = document.getElementById('drop-zone-area').clientWidth;
        let boxWidth = 35;
        let sweeps = 0;
        let movingRight = true;
        
        let interval = setInterval(() => {
            if (movingRight) {
                lightBox.style.left = `${areaWidth - boxWidth}px`;
                movingRight = false;
            } else {
                lightBox.style.left = `0px`;
                movingRight = true;
                sweeps++;
            }

            if (sweeps >= 3) { 
                clearInterval(interval);
                setTimeout(stopBoxAtAdminStart, 500); 
            }
        }, 600); 
    }

    function stopBoxAtAdminStart() {
        let areaWidth = document.getElementById('drop-zone-area').clientWidth;
        let colWidth = areaWidth / totalCols;
        
        let targetX = (ADMIN_START_ZONE * colWidth) + (colWidth / 2) - 17.5; 
        lightBox.style.left = `${targetX}px`;

        setTimeout(() => {
            lightBox.classList.remove('moving');
            lightBox.classList.add('stopped');
        }, 500);

        setTimeout(() => {
            dropPuck(ADMIN_START_ZONE, ADMIN_TARGET_SLOT, colWidth);
        }, 1000);
    }

    function dropPuck(startCol, targetCol, colWidth) {
        const puckEl = document.getElementById('puck');
        puckEl.style.display = 'block';
        
        let areaHeight = pegsArea.clientHeight;
        let rowHeight = areaHeight / rows;
        
        let dropPath = generatePath(startCol, targetCol, rows);
        
        let r = 0;
        let currentY = 0;
        let currentX = (startCol * colWidth) + (colWidth / 2);

        puckEl.style.left = `${currentX}px`;
        puckEl.style.top = `${currentY}px`;

        function animateBounce() {
            if (r >= rows) {
                finishPachinko(targetCol);
                return;
            }

            r++;
            let nextCol = dropPath[r];
            currentY = r * rowHeight;
            currentX = (nextCol * colWidth) + (colWidth / 2);

            puckEl.style.transition = 'top 0.25s cubic-bezier(0.55, 0.085, 0.68, 0.53), left 0.25s ease-out';
            puckEl.style.top = `${currentY}px`;
            puckEl.style.left = `${currentX}px`;

            setTimeout(animateBounce, 280); 
        }

        setTimeout(animateBounce, 200);
    }

    // ==========================================
    // FINISH & RETURN TO CRAZY TIME
    // ==========================================
    function finishPachinko(finalSlotIndex) {
        const slots = document.querySelectorAll('.slot');
        slots[finalSlotIndex].classList.add('highlight');
        
        let result = ADMIN_SLOTS[finalSlotIndex];

        if (result === 'DOUBLE' || result === 'TRIPLE') {
            overlayMsg.innerText = result + "!";
            overlayMsg.style.color = "#fff";
            overlayMsg.classList.add('show');
            
            setTimeout(() => {
                overlayMsg.classList.remove('show');
                slots[finalSlotIndex].classList.remove('highlight');
                
                let multiplier = result === 'DOUBLE' ? 2 : 3;
                
                ADMIN_SLOTS = ADMIN_SLOTS.map(val => {
                    if (val === 'DOUBLE' || val === 'TRIPLE') return val;
                    return val * multiplier;
                });
                renderSlots();
                
                ADMIN_START_ZONE = finalSlotIndex;
                ADMIN_TARGET_SLOT = Math.floor(Math.random() * 16); 
                startPachinkoGame();
            }, 2500);
            
        } else {
            let winAmount = betAmount * result;
            
            if (betAmount > 0) {
                balance += winAmount;
                localStorage.setItem('crazy_balance', balance); 
                
                // ಮেইন গেমে টাকা যোগ করার জন্য ডেটা পাঠানো
                localStorage.setItem('pending_bonus_win', winAmount); 

                overlayMsg.innerText = `YOU WON ৳${winAmount}`;
            } else {
                overlayMsg.innerText = `${result}X RESULT!`;
            }
            
            overlayMsg.classList.add('show');

            // খেলা শেষে মেইন গেমে (CrazyTime.html) ব্যাক করা
            setTimeout(() => {
                window.location.replace("crazy time.html"); 
            }, 4000);
        }
    }

    setTimeout(startPachinkoGame, 1000);

</script>
</body>
</html>
