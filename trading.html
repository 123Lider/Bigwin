<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROX - Binary Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');
        body { background: #0f172a; color: white; touch-action: pan-y; overflow: hidden; height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); }
        #live-clock { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="flex flex-col">

    <!-- Sounds -->
    <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="lossSound" src="https://assets.mixkit.co/active_storage/sfx/2511/2511-preview.mp3"></audio>

    <!-- Header -->
    <header class="glass px-4 py-3 flex justify-between items-center z-50 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="text-xl text-slate-300"><i class="fa-solid fa-chevron-left"></i></button>
            <div id="live-clock" class="text-blue-400 text-xs font-bold">00:00:00</div>
        </div>
        <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-wallet text-green-400 text-xs"></i>
            <span class="font-bold text-white text-sm">৳ <span id="user-balance">Connecting...</span></span>
        </div>
    </header>

    <!-- Chart -->
    <div id="chart-container" class="flex-1 relative bg-black">
        <!-- Error / Status Message -->
        <div id="auth-status" class="absolute top-2 left-2 text-[10px] text-red-500 z-50"></div>
        <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-blue-600 px-5 py-2 rounded-full text-[10px] font-bold z-[100] hidden border border-blue-400 shadow-xl uppercase">Trade Active</div>
    </div>

    <!-- Controls -->
    <div class="glass p-4 space-y-4 pb-10 border-t border-slate-800">
        <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800">
            <select id="marketSelect" onchange="switchMarket()" class="bg-transparent text-sm font-bold outline-none flex-1 text-slate-200">
                <option value="BTCUSDT">BTC/USDT</option>
                <option value="ETHUSDT">ETH/USDT</option>
            </select>
            <span class="text-yellow-500 font-bold text-[9px] bg-yellow-500/10 px-2 py-1 rounded">PROFIT 85%</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
                <span class="text-[8px] text-slate-500 uppercase tracking-widest block mb-1">Expiry</span>
                <div id="timerDisplay" class="font-bold text-lg text-blue-400">01:00</div>
            </div>
            <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
                <span class="text-[8px] text-slate-500 uppercase tracking-widest block mb-1">Amount</span>
                <input type="number" id="investAmount" value="100" class="bg-transparent font-bold text-lg w-full text-center outline-none">
            </div>
        </div>

        <div class="flex gap-4 h-14">
            <button onclick="placeTrade('DOWN')" class="flex-1 bg-red-500 hover:bg-red-600 rounded-xl font-bold text-lg active:scale-95 transition-all">DOWN ↓</button>
            <button onclick="placeTrade('UP')" class="flex-1 bg-green-500 hover:bg-green-600 rounded-xl font-bold text-lg active:scale-95 transition-all">UP ↑</button>
        </div>
    </div>

    <script>
        /// ====== Firebase Setup ======
         const firebaseConfig = { apiKey: "AIzaSyB2Gv7FXkDP5AJEm2MrZBEin6rN8YZwnK8", authDomain: "betbd-be722.firebaseapp.com", projectId: "betbd-be722", storageBucket: "betbd-be722.firebasestorage.app", messagingSenderId: "192673970713", appId: "1:192673970713:web:778a960157b5ff48638888", measurementId: "G-VE56XQM64X" };

        // -------------------------------------------------------------------------

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let userBalance = 0;
        let chart, candleSeries, ws, currentPrice = 0;
        let activeTrades = [];
        let markers = [];

        // ১. ব্যালেন্স সিঙ্ক (রিডাইরেক্ট বন্ধ করা হয়েছে)
        auth.onAuthStateChanged(user => {
            const statusDiv = document.getElementById('auth-status');
            if (user) {
                currentUser = user;
                statusDiv.innerText = "Logged In: " + user.email;
                statusDiv.style.color = "green";
                
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        userBalance = parseFloat(doc.data().balance || 0); 
                        document.getElementById('user-balance').innerText = userBalance.toFixed(2);
                    } else {
                        document.getElementById('user-balance').innerText = "No Data";
                    }
                }, err => {
                    statusDiv.innerText = "DB Error: " + err.message;
                });
            } else {
                statusDiv.innerText = "Not Logged In. Go to Home & Login.";
                document.getElementById('user-balance').innerText = "0.00";
            }
        });

        // ২. চার্ট ইনিশিয়ালাইজেশন (স্মুথ এবং ফাস্ট)
        async function init() {
            setInterval(() => document.getElementById('live-clock').innerText = new Date().toTimeString().split(' ')[0], 1000);
            const container = document.getElementById('chart-container');
            chart = LightweightCharts.createChart(container, {
                layout: { background: { color: '#000' }, textColor: '#707a8a', fontSize: 10 },
                grid: { vertLines: { color: '#161922' }, horzLines: { color: '#161922' } },
                timeScale: { timeVisible: true, secondsVisible: true, barSpacing: 12 },
                crosshair: { mode: 0 },
                priceScale: { borderVisible: false, position: 'right' }
            });

            candleSeries = chart.addCandlestickSeries({ 
                upColor: '#22c55e', downColor: '#ef4444', 
                borderVisible: false, wickUpColor: '#22c55e', wickDownColor: '#ef4444' 
            });

            await switchMarket();
            setInterval(checkExpiry, 1000);
            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
            });
        }

        async function switchMarket() {
            const sym = document.getElementById('marketSelect').value;
            // লোড হিস্টোরি (স্মুথনেস এর জন্য)
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=1m&limit=100`);
                const data = await res.json();
                candleSeries.setData(data.map(d => ({ time: d[0]/1000, open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) })));
            } catch(e) {}

            if(ws) ws.close();
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${sym.toLowerCase()}@kline_1s`);
            ws.onmessage = e => {
                const k = JSON.parse(e.data).k;
                currentPrice = parseFloat(k.c);
                candleSeries.update({ 
                    time: Math.floor(k.t/60000)*60, 
                    open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c) 
                });
            };
        }

        // ৩. ট্রেডিং লজিক (৩০ সেকেন্ড রুল + মাল্টি ট্রেড)
        async function placeTrade(dir) {
            const invest = parseFloat(document.getElementById('investAmount').value);
            if (!currentUser) return showToast("Login Required!", "#ef4444");
            if (invest > userBalance) return showToast("Low Balance!", "#ef4444");

            // ডাটাবেস আপডেট
            await db.collection('users').doc(currentUser.uid).update({ 
                balance: firebase.firestore.FieldValue.increment(-invest) 
            });

            const now = new Date();
            const sec = now.getSeconds();
            let expTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes() + (sec < 30 ? 1 : 2), 0).getTime();
            
            const color = dir === 'UP' ? '#22c55e' : '#ef4444';
            const line = candleSeries.createPriceLine({ price: currentPrice, color, lineWidth: 2, lineStyle: 2, title: dir });
            
            const m = { 
                time: Math.floor(Date.now()/1000), 
                position: dir==='UP'?'belowBar':'aboveBar', 
                color, shape: dir==='UP'?'arrowUp':'arrowDown', 
                size: 0.1, text: '•' 
            };
            markers.push(m);
            candleSeries.setMarkers(markers);

            activeTrades.push({ dir, entry: currentPrice, invest, expiry: expTime, line, marker: m });
            showToast("Trade Placed!");
        }

        async function checkExpiry() {
            const now = Date.now();
            for (let i = activeTrades.length - 1; i >= 0; i--) {
                let t = activeTrades[i];
                if (now >= t.expiry) {
                    const win = (t.dir === 'UP' && currentPrice > t.entry) || (t.dir === 'DOWN' && currentPrice < t.entry);
                    if (win) {
                        await db.collection('users').doc(currentUser.uid).update({ 
                            balance: firebase.firestore.FieldValue.increment(t.invest * 1.85) 
                        });
                        document.getElementById('winSound').play();
                        showToast("WIN!", "#22c55e");
                    } else {
                        document.getElementById('lossSound').play();
                        showToast("LOSS!", "#ef4444");
                    }
                    candleSeries.removePriceLine(t.line);
                    markers = markers.filter(x => x !== t.marker);
                    candleSeries.setMarkers(markers);
                    activeTrades.splice(i, 1);
                }
            }
            if(activeTrades.length > 0) {
                const diff = Math.max(0, Math.floor((activeTrades[0].expiry - now) / 1000));
                document.getElementById('timerDisplay').innerText = `00:${diff.toString().padStart(2,'0')}`;
            } else { document.getElementById('timerDisplay').innerText = "01:00"; }
        }

        function showToast(m, c="#3b82f6") {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.background = c; t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        }

        window.onload = init;
    </script>
</body>
</html>
