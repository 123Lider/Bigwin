<!DOCTYPE html>
<html lang="en">
<head>
    <title>RUN WIN</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Roboto', sans-serif; }

        /* UI Overlay */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-events-auto { pointer-events: auto; }

        /* Top Bar */
        #top-bar { display: flex; justify-content: space-between; padding: 12px; align-items: center; }
        .icon-btn { background: rgba(255,255,255,0.95); border: 2px solid #ccc; color: #333; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center;}
        #balance-display { background: rgba(255,255,255,0.95); padding: 6px 18px; border-radius: 20px; border: 2px solid #27ae60; font-weight: bold; color: #27ae60; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

        /* Floating Multiplier */
        #floating-ui { position: absolute; transform: translate(-50%, -50%); text-align: center; text-shadow: 2px 2px 5px rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; }
        #multiplier { font-family: 'Teko', sans-serif; font-size: 60px; font-weight: bold; color: #fff; line-height: 1; -webkit-text-stroke: 1.5px #000; }
        #status-text { font-size: 18px; font-weight: bold; color: #f1c40f; background: rgba(0,0,0,0.6); padding: 2px 10px; border-radius: 8px; margin-top: 5px; }
        
        /* Bottom Dual Betting Container */
        #bet-container { background: #111111; padding: 10px; border-top-left-radius: 15px; border-top-right-radius: 15px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); border-top: 1px solid #333;}
        
        .bet-panel { display: flex; gap: 10px; background: #1a1b1f; padding: 8px; border-radius: 10px; border: 1px solid #2a2b30; }
        .bet-left { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        
        .bet-input-row { display: flex; align-items: center; justify-content: space-between; background: #000; border-radius: 6px; padding: 3px; border: 1px solid #333; }
        .bet-btn { background: #2b2b36; border: none; color: #fff; width: 35px; height: 35px; border-radius: 5px; font-size: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .bet-btn:active { transform: scale(0.95); }
        .bet-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .bet-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 18px; font-weight: bold; text-align: center; outline: none; -moz-appearance: textfield; pointer-events: auto; width: 100%;}
        .bet-input::-webkit-outer-spin-button, .bet-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .quick-bets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .quick-bet-btn { background: #151515; border: 1px solid #2b2b36; color: #b3b3b3; border-radius: 4px; padding: 5px 0; font-size: 12px; font-weight: bold; cursor: pointer; }
        .quick-bet-btn:active { background: #333; color: white;}

        /* Action Buttons */
        .action-btn { flex: 0.9; background: #2ea043; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #1b6829; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; }
        .action-btn:active { transform: translateY(4px); box-shadow: none; }
        .action-main-text { font-size: 22px; font-weight: bold; text-transform: uppercase; line-height: 1; margin-bottom: 2px;}
        .action-subtext { font-size: 12px; font-weight: normal; opacity: 0.9;}

        .action-btn.waiting { background: #d35400; box-shadow: 0 4px 0 #9e3f00; }
        .action-btn.cashing { background: #e67e22; box-shadow: 0 4px 0 #af601a; }
        .action-btn.disabled { background: #333; box-shadow: 0 4px 0 #111; color: #666; cursor: not-allowed; transform: none; }

        /* Sidebar Menu */
        #menu-modal { position: absolute; top: 0; right: -100%; width: 260px; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 100; transition: 0.3s; padding: 20px; border-left: 2px solid #3b82f6; flex-direction: column; display: flex; pointer-events: auto; color: white; box-shadow: -5px 0 15px rgba(0,0,0,0.5);}
        #menu-modal.open { right: 0; }
        .menu-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; flex-direction: row-reverse; }
        .close-menu { cursor: pointer; color: #e74c3c; padding-right: 5px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #333; font-size: 16px; cursor: pointer; font-weight: bold; }
        #history-list { margin-top: 10px; flex: 1; overflow-y: auto; font-size: 14px; font-weight: bold; }
        .history-item { padding: 8px 0; display: flex; justify-content: space-between; border-bottom: 1px dashed #444; }
        .win { color: #27ae60; } .loss { color: #e74c3c; }

    </style>

    <!-- Firebase SDK (For Background Balance Sync) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="game-ui">
        <div id="top-bar">
            <!-- Back to Dashboard -->
            <button class="icon-btn pointer-events-auto" onclick="window.location.replace('index.html')">←</button>
            <div id="balance-display">৳ <span id="balance">0.00</span></div>
            <!-- Menu Button -->
            <button class="icon-btn pointer-events-auto" id="menu-btn">☰</button>
        </div>

        <div id="floating-ui">
            <div id="multiplier">WAITING</div>
            <div id="status-text">Starting in 10s</div>
        </div>

        <div id="bet-container" class="pointer-events-auto">
            <!-- Panel 1 -->
            <div class="bet-panel" id="panel-0">
                <div class="bet-left">
                    <div class="bet-input-row">

                        <button class="quick-bet-btn" data-val="100">100</button>
                        <button class="quick-bet-btn" data-val="500">500</button>

                        <button class="quick-bet-btn" data-val="5000">5k</button>
                    </div>
                </div>
                <button class="action-btn">
                    <div class="action-main-text">BET</div>
                    <div class="action-subtext">10.00 BDT</div>
                </button>
            </div>

            <!-- Panel 2 -->
            <div class="bet-panel" id="panel-1">
                <div class="bet-left">
                    <div class="bet-input-row">
                        <button class="bet-btn minus-btn">−</button>
                        <input type="number" class="bet-input" value="10" min="5">
                        <button class="bet-btn plus-btn">+</button>
                    </div>
                    <div class="quick-bets">
                        <button class="quick-bet-btn" data-val="100">100</button>
                        <button class="quick-bet-btn" data-val="500">500</button>
                        <button class="quick-bet-btn" data-val="1000">1k</button>
                        <button class="quick-bet-btn" data-val="5000">5k</button>
                    </div>
                </div>
                <button class="action-btn">
                    <div class="action-main-text">BET</div>
                    <div class="action-subtext">10.00 BDT</div>
                </button>
            </div>
        </div>
    </div>

    <!-- Right Sidebar Menu -->
    <div id="menu-modal">
        <div class="menu-title"><span class="close-menu" id="close-menu-btn">✕</span> RUN WIN MENU</div>
        <div class="menu-item" id="sound-toggle-menu">Sound <span id="sound-status" style="color:#3498db;">ON</span></div>
        <div class="menu-title" style="margin-top:20px; font-size:16px; border-bottom: none; display:block;">Bet History</div>
        <div id="history-list"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==========================================
        // 1. Silent JS Balance Connection
        // ==========================================
        const firebaseConfig = { apiKey: "AIzaSyB2Gv7FXkDP5AJEm2MrZBEin6rN8YZwnK8", authDomain: "betbd-be722.firebaseapp.com", projectId: "betbd-be722", storageBucket: "betbd-be722.firebasestorage.app", messagingSenderId: "192673970713", appId: "1:192673970713:web:778a960157b5ff48638888", measurementId: "G-VE56XQM64X" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let balance = 0; 

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if(doc.exists) {
                        balance = parseFloat(doc.data().balance) || 0;
                        document.getElementById('balance').innerText = balance.toFixed(2);
                    }
                });
            }
        });

        function syncBalanceToFirebase(amountChange) {
            if(currentUser) {
                db.collection("users").doc(currentUser.uid).update({
                    balance: firebase.firestore.FieldValue.increment(amountChange)
                }).catch(e => console.log("Background sync error"));
            }
        }


        // ==========================================
        // 2. Game Logic & UI Variables
        // ==========================================
        const MIN_BET = 5;
        let soundOn = true;
        let gameState = 'waiting'; 
        let bets = [ { amount: 10, state: 'none' }, { amount: 10, state: 'none' } ];
        let multiplier = 1.00;
        let crashPoint = 0;
        let countdownTimer = 10.0;
        let runSpeed = 0;

        const uiMultiplier = document.getElementById('multiplier');
        const uiStatusText = document.getElementById('status-text');
        const uiFloatingBox = document.getElementById('floating-ui');
        
        // Menu Elements
        const menuBtn = document.getElementById('menu-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const menuModal = document.getElementById('menu-modal');
        const soundToggleMenu = document.getElementById('sound-toggle-menu');
        const soundStatus = document.getElementById('sound-status');
        const uiHistory = document.getElementById('history-list');

        const uiInputs = document.querySelectorAll('.bet-input');
        const uiMinusBtns = document.querySelectorAll('.minus-btn');
        const uiPlusBtns = document.querySelectorAll('.plus-btn');
        const uiActionBtns = document.querySelectorAll('.action-btn');
        const uiActionMains = document.querySelectorAll('.action-main-text');
        const uiActionSubs = document.querySelectorAll('.action-subtext');
        const quickBetContainers = [ document.querySelectorAll('#panel-0 .quick-bet-btn'), document.querySelectorAll('#panel-1 .quick-bet-btn') ];

        // --- Audio System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol) {
            if(!soundOn || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playFootstep() {
            if(!soundOn || audioCtx.state === 'suspended') return;
            const bufferSize = audioCtx.sampleRate * 0.05; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0); for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1; 
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 600; 
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start();
        }
        function initAudio() { if(audioCtx.state === 'suspended') audioCtx.resume(); }

        // --- Menu Logic ---
        menuBtn.onclick = () => { menuModal.classList.add('open'); initAudio(); };
        closeMenuBtn.onclick = () => { menuModal.classList.remove('open'); };
        soundToggleMenu.onclick = () => { 
            soundOn = !soundOn; 
            soundStatus.innerText = soundOn ? 'ON' : 'OFF'; 
            soundStatus.style.color = soundOn ? '#3498db' : '#e74c3c';
        };

        function addToHistory(mult, amount, isWin) {
            const div = document.createElement('div');
            div.className = 'history-item ' + (isWin ? 'win' : 'loss');
            div.innerHTML = `<span>${mult.toFixed(2)}x</span> <span>${isWin ? '+'+amount.toFixed(2) : '-'+amount.toFixed(2)} ৳</span>`;
            uiHistory.prepend(div);
        }

        // ==========================================
        // 3. Instant Betting System
        // ==========================================
        [0, 1].forEach(i => {
            function updateVal(val) {
                bets[i].amount = val; uiInputs[i].value = val;
                if(gameState === 'waiting' && bets[i].state === 'none') uiActionSubs[i].innerText = val.toFixed(2) + ' BDT';
            }

            uiMinusBtns[i].onclick = () => { updateVal(Math.max(MIN_BET, bets[i].amount - 5)); playTone(400, 'sine', 0.1, 0.1); initAudio();};
            uiPlusBtns[i].onclick = () => { updateVal(bets[i].amount + 5); playTone(500, 'sine', 0.1, 0.1); initAudio();};
            quickBetContainers[i].forEach(btn => { btn.onclick = () => { updateVal(parseInt(btn.getAttribute('data-val'))); playTone(500, 'sine', 0.1, 0.1); initAudio(); } });

            uiInputs[i].addEventListener('blur', (e) => {
                let val = parseInt(e.target.value); if(isNaN(val) || val < MIN_BET) val = MIN_BET; updateVal(val);
            });

            uiActionBtns[i].onclick = () => {
                initAudio();
                if(gameState === 'waiting') {
                    if(bets[i].state === 'none') {
                        if(balance < bets[i].amount) { alert("Insufficient Balance!"); return; }
                        
                        balance -= bets[i].amount;
                        document.getElementById('balance').innerText = balance.toFixed(2);
                        syncBalanceToFirebase(-bets[i].amount);
                        
                        bets[i].state = 'betted';
                        uiActionMains[i].innerText = 'CANCEL';
                        uiActionSubs[i].innerText = 'WAITING';
                        uiActionBtns[i].className = 'action-btn waiting';
                        uiMinusBtns[i].disabled = uiPlusBtns[i].disabled = uiInputs[i].disabled = true;
                        playTone(800, 'square', 0.2, 0.1);
                    } 
                    else if(bets[i].state === 'betted') {
                        balance += bets[i].amount;
                        document.getElementById('balance').innerText = balance.toFixed(2);
                        syncBalanceToFirebase(bets[i].amount);
                        
                        bets[i].state = 'none';
                        uiActionMains[i].innerText = 'BET';
                        uiActionSubs[i].innerText = bets[i].amount.toFixed(2) + ' BDT';
                        uiActionBtns[i].className = 'action-btn';
                        uiMinusBtns[i].disabled = uiPlusBtns[i].disabled = uiInputs[i].disabled = false;
                        playTone(400, 'square', 0.1, 0.1);
                    }
                } 
                else if(gameState === 'running') {
                    if(bets[i].state === 'betted') {
                        let won = bets[i].amount * multiplier;
                        
                        balance += won;
                        document.getElementById('balance').innerText = balance.toFixed(2);
                        syncBalanceToFirebase(won);
                        
                        addToHistory(multiplier, won, true); // History log

                        bets[i].state = 'cashed_out';
                        uiActionMains[i].innerText = 'SUCCESS!';
                        uiActionSubs[i].innerText = '+' + won.toFixed(2) + ' BDT';
                        uiActionBtns[i].className = 'action-btn disabled';
                        uiActionBtns[i].disabled = true;
                        
                        playTone(800, 'square', 0.1, 0.1);
                        setTimeout(() => playTone(1200, 'square', 0.3, 0.1), 100);
                    }
                }
            };
        });

        // --- Core Game Loop Functions ---
        function startRound() {
            gameState = 'running'; multiplier = 1.00;
            uiStatusText.style.display = 'none'; uiMultiplier.style.color = '#fff';
            crashPoint = Math.max(1.01, Math.exp(Math.random() * 2.5)); 
            
            [0, 1].forEach(i => {
                if(bets[i].state === 'betted') {
                    uiActionBtns[i].className = 'action-btn cashing'; uiActionMains[i].innerText = 'CASH OUT'; uiActionBtns[i].disabled = false;
                } else {
                    uiActionMains[i].innerText = 'WAITING'; uiActionSubs[i].innerText = 'NEXT ROUND';
                    uiActionBtns[i].className = 'action-btn disabled'; uiActionBtns[i].disabled = true;
                }
            });

            torso.rotation.x = 0.2; torso.position.y = 2.5; characterGroup.position.z = 0; runSpeed = 16;
        }

        function crashRound() {
            gameState = 'crashed'; runSpeed = 0;
            playTone(150, 'sawtooth', 0.5, 0.3);

            uiMultiplier.style.color = '#e74c3c'; uiStatusText.style.display = 'block';
            uiStatusText.innerText = 'CRASHED!'; uiStatusText.style.color = '#e74c3c';

            [0, 1].forEach(i => {
                if(bets[i].state === 'betted') {
                    addToHistory(multiplier, bets[i].amount, false); // History Log for loss
                }
                uiActionMains[i].innerText = 'CRASHED'; uiActionSubs[i].innerText = '';
                uiActionBtns[i].className = 'action-btn disabled'; uiActionBtns[i].disabled = true;
            });

            torso.rotation.x = -Math.PI / 2.2; torso.position.y = 0.5;
            setTimeout(() => { startWaitingPhase(); }, 3000);
        }

        function startWaitingPhase() {
            gameState = 'waiting'; countdownTimer = 10.0;
            uiMultiplier.style.color = '#fff'; uiStatusText.style.display = 'block'; uiStatusText.style.color = '#f1c40f';
            
            [0, 1].forEach(i => {
                bets[i].state = 'none';
                uiActionMains[i].innerText = 'BET'; uiActionSubs[i].innerText = bets[i].amount.toFixed(2) + ' BDT';
                uiActionBtns[i].className = 'action-btn'; uiActionBtns[i].disabled = false;
                uiMinusBtns[i].disabled = uiPlusBtns[i].disabled = uiInputs[i].disabled = false;
            });

            // Character Reset
            torso.rotation.x = 0; torso.position.y = 2.5;
            leftUpperArm.rotation.x = rightUpperArm.rotation.x = 0; leftLowerArm.rotation.x = rightLowerArm.rotation.x = 0;
            leftUpperLeg.rotation.x = rightUpperLeg.rotation.x = 0; leftLowerLeg.rotation.x = rightLowerLeg.rotation.x = 0;

            // BUG FIX: Reset Environment Objects Positions
            if(environmentObjects && environmentObjects.length > 0) {
                environmentObjects.forEach((obj, index) => {
                    let zPos = Math.random() * 400 - 50;
                    obj.position.z = zPos;
                });
            }
        }

        // ==========================================
        // --- THREE.JS 3D ENGINE ---
        // ==========================================
        let scene, camera, renderer, clock;
        let characterGroup, leftUpperArm, leftLowerArm, rightUpperArm, rightLowerArm, leftUpperLeg, leftLowerLeg, rightUpperLeg, rightLowerLeg, torso, head;
        let environmentObjects = []; let stepTime = 0;

        init3D(); animate3D(); startWaitingPhase(); 

        function init3D() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x87CEEB); scene.fog = new THREE.Fog(0x87CEEB, 20, 150);
            camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
            camera.position.set(0, 4, -9); camera.lookAt(0, 2, 10);
            renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; document.body.insertBefore(renderer.domElement, document.body.firstChild);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xfff5b6, 1.5); sun.position.set(-20, 50, -20); sun.castShadow = true;
            sun.shadow.camera.left = -20; sun.shadow.camera.right = 20; sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20; scene.add(sun);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 1000), new THREE.MeshStandardMaterial({ color: 0x7cb342 }));
            floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

            const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 1000), new THREE.MeshStandardMaterial({ color: 0x555555 }));
            road.rotation.x = -Math.PI / 2; road.position.y = 0.01; road.receiveShadow = true; scene.add(road);

            const houseColors = [0xe74c3c, 0xf1c40f, 0x3498db, 0x9b59b6, 0xecf0f1];
            for(let i=0; i<30; i++) {
                let zPos = Math.random() * 400 - 50; let side = Math.random() > 0.5 ? 1 : -1; let xPos = side * (Math.random() * 10 + 8); 
                const house = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), new THREE.MeshStandardMaterial({color: houseColors[Math.floor(Math.random()*houseColors.length)]}));
                body.position.y = 2; body.castShadow = true;
                const roof = new THREE.Mesh(new THREE.ConeGeometry(3.5, 2, 4), new THREE.MeshStandardMaterial({color: 0x8b0000})); roof.position.y = 5; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
                house.add(body, roof); house.position.set(xPos, 0, zPos); scene.add(house); environmentObjects.push(house);

                const lamp = new THREE.Group(); const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 5), new THREE.MeshStandardMaterial({color: 0x2d3436})); pole.position.y = 2.5; pole.castShadow = true;
                const top = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 0.4), new THREE.MeshStandardMaterial({color: 0x2d3436})); top.position.set(side * -0.5, 5, 0);
                lamp.add(pole, top); lamp.position.set(side * 5, 0, zPos + 5); scene.add(lamp); environmentObjects.push(lamp);
            }
            buildCharacter();
            clock = new THREE.Clock();
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }

        function createBone(radius, length, color) {
            const group = new THREE.Group();
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius*0.8, length, 12), new THREE.MeshStandardMaterial({color: color}));
            mesh.position.y = -length / 2; mesh.castShadow = true; group.add(mesh);
            const joint = new THREE.Mesh(new THREE.SphereGeometry(radius*1.1, 12, 12), new THREE.MeshStandardMaterial({color: color})); group.add(joint); return group;
        }

        function buildCharacter() {
            characterGroup = new THREE.Group(); scene.add(characterGroup);
            const skin = 0xffe0bd, clothes = 0x2980b9; 
            torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.6), new THREE.MeshStandardMaterial({color: clothes})); torso.position.y = 2.5; torso.castShadow = true; characterGroup.add(torso);
            head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshStandardMaterial({color: skin})); head.position.y = 1.1; head.castShadow = true; torso.add(head);

            leftUpperArm = createBone(0.2, 0.8, skin); leftUpperArm.position.set(0.7, 0.6, 0); torso.add(leftUpperArm);
            leftLowerArm = createBone(0.15, 0.8, skin); leftLowerArm.position.set(0, -0.8, 0); leftUpperArm.add(leftLowerArm);
            rightUpperArm = createBone(0.2, 0.8, skin); rightUpperArm.position.set(-0.7, 0.6, 0); torso.add(rightUpperArm);
            rightLowerArm = createBone(0.15, 0.8, skin); rightLowerArm.position.set(0, -0.8, 0); rightUpperArm.add(rightLowerArm);
            leftUpperLeg = createBone(0.25, 0.9, 0x34495e); leftUpperLeg.position.set(0.3, -0.7, 0); torso.add(leftUpperLeg);
            leftLowerLeg = createBone(0.2, 0.9, skin); leftLowerLeg.position.set(0, -0.9, 0); leftUpperLeg.add(leftLowerLeg);
            rightUpperLeg = createBone(0.25, 0.9, 0x34495e); rightUpperLeg.position.set(-0.3, -0.7, 0); torso.add(rightUpperLeg);
            rightLowerLeg = createBone(0.2, 0.9, skin); rightLowerLeg.position.set(0, -0.9, 0); rightUpperLeg.add(rightLowerLeg);
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            const delta = clock.getDelta(); const time = clock.getElapsedTime();

            if(gameState === 'waiting') {
                countdownTimer -= delta; uiMultiplier.innerText = 'WAITING'; uiStatusText.innerText = `Starting in ${(Math.max(0, countdownTimer)).toFixed(1)}s`;
                if(countdownTimer <= 0) startRound();
            } 
            else if(gameState === 'running') {
                multiplier += delta * 0.12 * multiplier; uiMultiplier.innerText = multiplier.toFixed(2) + 'x';
                
                [0, 1].forEach(i => { if(bets[i].state === 'betted') uiActionSubs[i].innerText = (bets[i].amount * multiplier).toFixed(2) + ' BDT'; });
                if(multiplier >= crashPoint) crashRound();
                
                characterGroup.position.z += 15 * delta;
                const cycle = time * runSpeed;
                leftUpperArm.rotation.x = Math.sin(cycle) * 1.5; rightUpperArm.rotation.x = Math.sin(cycle + Math.PI) * 1.5;
                leftLowerArm.rotation.x = -Math.abs(Math.sin(cycle + Math.PI/2)) * 1.5; rightLowerArm.rotation.x = -Math.abs(Math.sin(cycle - Math.PI/2)) * 1.5;
                leftUpperLeg.rotation.x = Math.sin(cycle + Math.PI) * 1.2; rightUpperLeg.rotation.x = Math.sin(cycle) * 1.2;
                leftLowerLeg.rotation.x = Math.abs(Math.sin(cycle + Math.PI/2 + 0.5)) * 1.5; rightLowerLeg.rotation.x = Math.abs(Math.sin(cycle - Math.PI/2 + 0.5)) * 1.5;
                torso.position.y = 2.5 + Math.abs(Math.sin(cycle * 2)) * 0.2;

                stepTime += delta * runSpeed; if(stepTime > Math.PI) { playFootstep(); stepTime = 0; }
            }

            camera.position.z = characterGroup.position.z - 9; camera.position.x = 0; 
            environmentObjects.forEach(obj => { if(obj.position.z < camera.position.z - 15) obj.position.z += 300 + Math.random() * 50; });

            if(head && camera) {
                const headPos = new THREE.Vector3(); head.getWorldPosition(headPos); headPos.y += 2.2; headPos.project(camera); 
                const x = (headPos.x * .5 + .5) * window.innerWidth; const y = (headPos.y * -.5 + .5) * window.innerHeight;
                uiFloatingBox.style.left = `${x}px`; uiFloatingBox.style.top = `${y}px`;
            }
            renderer.render(scene, camera);
        }

// ==========================================
    // MOBILE BACK BUTTON FIX
    // ==========================================
    window.history.pushState(null, null, window.location.href);
    window.addEventListener('popstate', function(event) {
        window.location.replace('index.html');
    });
    </script>
