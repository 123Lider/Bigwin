<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DICE ROLL</title>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #111; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        /* Loader */
        #pageLoader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; color: #f39c12; font-size: 24px; font-weight: bold; }

        /* Header Section */
        .header { width: 100%; height: 60px; background: linear-gradient(to bottom, #222, #111); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; box-sizing: border-box; border-bottom: 2px solid #f39c12; z-index: 100; flex-shrink: 0; }
        .back-btn { color: #f39c12; text-decoration: none; font-size: 18px; background: #333; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #555; }
        .balance-board { font-size: 18px; font-weight: bold; color: #f1c40f; display: flex; align-items: center; gap: 5px; }
        .menu-btn { font-size: 24px; cursor: pointer; color: white; background: none; border: none; transition: 0.2s; padding: 5px; }
        .menu-btn:hover { color: #f39c12; }

        /* Slide-in Menu & Overlay */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; }
        .side-menu { position: fixed; top: 0; right: -320px; width: 280px; height: 100vh; background: #1a1a1a; border-left: 2px solid #f39c12; transition: right 0.3s ease; z-index: 200; padding: 20px; box-sizing: border-box; box-shadow: -5px 0 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
        .side-menu.open { right: 0; }

        .menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; color: #f39c12; font-weight: bold; font-size: 20px; }
        .close-btn { font-size: 30px; cursor: pointer; color: #e74c3c; line-height: 1; }
        
        .sound-btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; background: #2980b9; color: white; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .sound-btn.off { background: #555; }

        .history-container { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .history-title { font-size: 16px; color: #f39c12; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { background: #333; margin-bottom: 8px; padding: 10px; border-radius: 5px; font-size: 13px; border-left: 4px solid #fff; }
        .history-item.win { border-left-color: #2ecc71; }
        .history-item.lose { border-left-color: #e74c3c; }
        .history-container::-webkit-scrollbar { width: 4px; }
        .history-container::-webkit-scrollbar-thumb { background: #f39c12; border-radius: 10px; }

        /* 3D Room Setup */
        .room { width: 100%; flex: 1; perspective: 1200px; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at top, #2c3e50, #000); position: relative; overflow: hidden; }

        .board { width: 300px; height: 300px; background: radial-gradient(circle, #1e8449 20%, #0b5345 90%); border: 15px solid #5c3a21; border-radius: 20px; box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.5); transform: rotateX(65deg) rotateZ(25deg); transform-style: preserve-3d; position: relative; }
        @media (min-width: 768px) { .board { width: 400px; height: 400px; } }

        .dice-wrapper { position: absolute; width: 60px; height: 60px; transform-style: preserve-3d; transform: translateZ(30px); }
        #dw1 { top: 20%; left: 40%; }
        #dw2 { top: 50%; left: 20%; }
        #dw3 { top: 60%; left: 60%; }

        .dice { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s ease-out; }
        .shadow { position: absolute; width: 60px; height: 60px; background: rgba(0,0,0,0.7); filter: blur(8px); transform: translateZ(-30px); transition: all 0.5s; }

        .face { position: absolute; width: 60px; height: 60px; background: linear-gradient(135deg, #fff, #e6e6e6); border: 1px solid #ccc; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 8px; box-sizing: border-box; }
        .dot { width: 12px; height: 12px; background: #222; border-radius: 50%; justify-self: center; align-self: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .red-dot { background: #e74c3c; }

        .front  { transform: rotateY(0deg) translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY(90deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX(90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }

        @keyframes jump { 0% { transform: translateZ(30px); } 50% { transform: translateZ(250px); } 100% { transform: translateZ(30px); } }
        .jumping { animation: jump 1s cubic-bezier(0.25, 1, 0.5, 1); }
        .jumping-shadow { animation: shadow-fade 1s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes shadow-fade { 0% { filter: blur(8px); opacity: 0.8; transform: translateZ(-30px) scale(1); } 50% { filter: blur(30px); opacity: 0.2; transform: translateZ(-250px) scale(2); } 100% { filter: blur(8px); opacity: 0.8; transform: translateZ(-30px) scale(1); } }

        /* UI Panel */
        .ui-panel { width: 100%; background: linear-gradient(to top, #1a1a1a, #222); display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 2px solid #f39c12; z-index: 10; padding: 20px 10px; flex-shrink: 0; }

        .result-msg { font-size: 16px; font-weight: bold; height: 20px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .win-text { color: #2ecc71; }
        .lose-text { color: #e74c3c; }

        .bet-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        
        .control-btn { width: 45px; height: 45px; font-size: 24px; cursor: pointer; border: none; border-radius: 8px; background: #2980b9; color: white; font-weight: bold; box-shadow: 0 4px 0 #1c5980; transition: 0.1s; display: flex; justify-content: center; align-items: center; }
        .control-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1c5980; }
        
        #betAmount { font-size: 20px; width: 120px; text-align: center; padding: 8px; border-radius: 8px; border: 2px solid #555; background: #000; color: #fff; font-weight: bold; outline: none; }

        .roll-btn { background: #e67e22; box-shadow: 0 6px 0 #ba6419; font-size: 20px; padding: 15px 40px; text-transform: uppercase; letter-spacing: 2px; color: white; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.1s; width: 100%; max-width: 300px; }
        .roll-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #ba6419; }
        .roll-btn:disabled { filter: grayscale(100%); cursor: not-allowed; transform: translateY(6px); box-shadow: none; }

    </style>
</head>
<body>

    <!-- 3D Sounds -->
    <audio id="rollSound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" preload="auto"></audio>
    <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>
    <audio id="loseSound" src="https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3" preload="auto"></audio>

    <div id="pageLoader">LOADING DICE...</div>

    <!-- Header -->
    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="balance-board">৳ <span id="balance">0.00</span></div>
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- Slide Menu & Overlay -->
    <div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <span>MENU</span>
            <i class="fa-solid fa-xmark close-btn" onclick="toggleMenu()"></i>
        </div>
        <button id="soundBtn" class="sound-btn" onclick="toggleSound()">
            <span><i class="fa-solid fa-volume-high"></i> Sound Effect</span>
            <span id="soundStatus" style="color:#2ecc71">ON</span>
        </button>
        
        <div class="history-title"><i class="fa-solid fa-list"></i> My Bet History</div>
        <div class="history-container">
            <ul class="history-list" id="historyList">
                <li style="text-align:center; color:#777; padding:10px;">No history yet</li>
            </ul>
        </div>
    </div>

    <!-- 3D Room -->
    <div class="room">
        <div class="board">
            <div class="dice-wrapper" id="dw1">
                <div class="shadow"></div>
                <div class="dice" id="d1">
                    <div class="face front"><div style="grid-area: 2/2"><div class="dot red-dot"></div></div></div>
                    <div class="face back"><div style="grid-area: 1/1"><div class="dot"></div></div><div style="grid-area: 1/3"><div class="dot"></div></div><div style="grid-area: 2/1"><div class="dot"></div></div><div style="grid-area: 2/3"><div class="dot"></div></div><div style="grid-area: 3/1"><div class="dot"></div></div><div style="grid-area: 3/3"><div class="dot"></div></div></div>
                    <div class="face right"><div style="grid-area: 1/1"><div class="dot"></div></div><div style="grid-area: 2/2"><div class="dot"></div></div><div style="grid-area: 3/3"><div class="dot"></div></div></div>
                    <div class="face left"><div style="grid-area: 1/1"><div class="dot"></div></div><div style="grid-area: 1/3"><div class="dot"></div></div><div style="grid-area: 3/1"><div class="dot"></div></div><div style="grid-area: 3/3"><div class="dot"></div></div></div>
                    <div class="face top"><div style="grid-area: 1/1"><div class="dot"></div></div><div style="grid-area: 1/3"><div class="dot"></div></div><div style="grid-area: 2/2"><div class="dot"></div></div><div style="grid-area: 3/1"><div class="dot"></div></div><div style="grid-area: 3/3"><div class="dot"></div></div></div>
                    <div class="face bottom"><div style="grid-area: 1/1"><div class="dot"></div></div><div style="grid-area: 3/3"><div class="dot"></div></div></div>
                </div>
            </div>
            <div class="dice-wrapper" id="dw2"><div class="shadow"></div><div class="dice" id="d2"></div></div>
            <div class="dice-wrapper" id="dw3"><div class="shadow"></div><div class="dice" id="d3"></div></div>
        </div>
    </div>

    <!-- UI Panel -->
    <div class="ui-panel">
        <div class="result-msg" id="resultMsg" style="color:#aaa;">Target Sum: 12 or more to win!</div>
        
        <div class="bet-controls">
            <button class="control-btn" onclick="changeBet(-10)">−</button>
            <input type="number" id="betAmount" value="10" min="10" max="10000" oninput="validateBet()">
            <button class="control-btn" onclick="changeBet(10)">+</button>
        </div>

        <button class="roll-btn" id="rollButton" onclick="rollDice()">ROLL DICE</button>
    </div>

    <script>
        // Clone Dice HTML
        document.getElementById('d2').innerHTML = document.getElementById('d1').innerHTML;
        document.getElementById('d3').innerHTML = document.getElementById('d1').innerHTML;

        // ====== Firebase PROX Setup ======
        const firebaseConfig = {
            apiKey: "AIzaSyB2Gv7FXkDP5AJEm2MrZBEin6rN8YZwnK8",
            authDomain: "betbd-be722.firebaseapp.com",
            projectId: "betbd-be722"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let balance = 0;
        let isRolling = false;
        let isSoundOn = true;

        const rollSound = document.getElementById('rollSound');
        const winSound = document.getElementById('winSound');
        const loseSound = document.getElementById('loseSound');

        // Auth Check & Balance Sync
        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if(doc.exists) {
                        balance = doc.data().balance;
                        document.getElementById('balance').innerText = balance.toFixed(2);
                    }
                });
                document.getElementById('pageLoader').style.display = 'none';
            } else {
                window.location.href = 'index.html';
            }
        });

        // Menu Toggle
        function toggleMenu() {
            const m = document.getElementById('sideMenu');
            const o = document.getElementById('menuOverlay');
            m.classList.toggle('open');
            o.style.display = m.classList.contains('open') ? 'block' : 'none';
        }

        // Sound Toggle
        function toggleSound() {
            isSoundOn = !isSoundOn;
            let status = document.getElementById('soundStatus');
            let btn = document.getElementById('soundBtn');
            if(isSoundOn) {
                status.innerText = "ON";
                status.style.color = "#2ecc71";
                btn.classList.remove('off');
                rollSound.play().catch(()=>{}); rollSound.pause(); // Unlock
            } else {
                status.innerText = "OFF";
                status.style.color = "#e74c3c";
                btn.classList.add('off');
            }
        }

        function playAudio(audioElement) {
            if(isSoundOn) { audioElement.currentTime = 0; audioElement.play().catch(()=>{}); }
        }

        // Betting logic
        function changeBet(amount) {
            if (isRolling) return;
            let betInput = document.getElementById('betAmount');
            let newBet = parseInt(betInput.value) + amount;
            if(newBet >= 10 && newBet <= 10000) betInput.value = newBet;
        }

        function validateBet() {
            let betInput = document.getElementById('betAmount');
            if (betInput.value > 10000) betInput.value = 10000;
            if (betInput.value < 10 && betInput.value !== "") betInput.value = 10;
        }

        // ====== Dice Roll & Game Brain ======
        function rollDice() {
            let betAmount = parseInt(document.getElementById('betAmount').value);
            if (isNaN(betAmount) || betAmount < 10) return alert("সর্বনিম্ন বেট ১০ টাকা!");
            if (betAmount > balance) return alert("আপনার ব্যালেন্স অপর্যাপ্ত!");
            if (isRolling) return;

            isRolling = true;
            document.getElementById('rollButton').disabled = true;
            document.getElementById('resultMsg').innerText = "Rolling...";
            document.getElementById('resultMsg').className = "result-msg";
            document.getElementById('resultMsg').style.color = "#f39c12";
            
            // Deduct Balance Immediately
            db.collection("users").doc(currentUser.uid).update({ balance: balance - betAmount });

            playAudio(rollSound);

            const diceWrappers = [document.getElementById('dw1'), document.getElementById('dw2'), document.getElementById('dw3')];
            const dices = [document.getElementById('d1'), document.getElementById('d2'), document.getElementById('d3')];
            const shadows = document.querySelectorAll('.shadow');

            // Jump Animation
            diceWrappers.forEach(dw => dw.classList.add('jumping'));
            shadows.forEach(sh => sh.classList.add('jumping-shadow'));

            // Spin Randomly
            dices.forEach(dice => {
                let randomSpinX = Math.floor(Math.random() * 1000) + 1000;
                let randomSpinY = Math.floor(Math.random() * 1000) + 1000;
                dice.style.transition = "transform 1s linear";
                dice.style.transform = `rotateX(${randomSpinX}deg) rotateY(${randomSpinY}deg)`;
            });

            setTimeout(() => {
                diceWrappers.forEach(dw => dw.classList.remove('jumping'));
                shadows.forEach(sh => sh.classList.remove('jumping-shadow'));
                
                // --- COMPANY BRAIN LOGIC ---
                // Win chance: ~30% for Sum >= 12
                let isWin = Math.random() < 0.3; 
                let results = getDiceFaces(isWin);

                dices.forEach((dice, index) => {
                    setFinalDiceFace(dice, results[index]);
                });

                calculateResult(results, betAmount);
            }, 1000); 
        }

        // Logic to force dice sum based on win/lose decision
        function getDiceFaces(shouldWin) {
            let sum, d1, d2, d3;
            if(shouldWin) {
                // Must be >= 12
                sum = Math.floor(Math.random() * 7) + 12; // 12 to 18
            } else {
                // Must be < 12
                sum = Math.floor(Math.random() * 8) + 3; // 3 to 10
            }

            // Distribute sum into 3 dices
            do {
                d1 = Math.floor(Math.random() * 6) + 1;
                d2 = Math.floor(Math.random() * 6) + 1;
                d3 = sum - d1 - d2;
            } while(d3 < 1 || d3 > 6);

            return [d1, d2, d3];
        }

        function setFinalDiceFace(diceElement, number) {
            diceElement.style.transition = "transform 0.2s ease-out";
            let x = 0, y = 0;
            switch(number) {
                case 1: x = 0; y = 0; break; 
                case 6: x = 180; y = 0; break; 
                case 3: x = 0; y = -90; break; 
                case 4: x = 0; y = 90; break; 
                case 5: x = -90; y = 0; break; 
                case 2: x = 90; y = 0; break; 
            }
            diceElement.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;
        }

        // Calculate Result & Update Firebase
        function calculateResult(diceResults, bet) {
            let totalSum = diceResults[0] + diceResults[1] + diceResults[2];
            let resultMsg = document.getElementById('resultMsg');
            let historyList = document.getElementById('historyList');
            if(historyList.children[0] && historyList.children[0].innerText === 'No history yet') historyList.innerHTML = '';
            
            let status = "";
            let historyText = "";

            if (totalSum < 12) {
                resultMsg.innerText = `Sum: ${totalSum}. You Lose ৳${bet}`;
                resultMsg.className = "result-msg lose-text";
                playAudio(loseSound);
                status = "lose";
                historyText = `<b>Sum: ${totalSum}</b> | Bet: ৳${bet} | <span style="color:#e74c3c;">Lost ৳${bet}</span>`;
                
                db.collection("transactions").add({ uid: currentUser.uid, amount: -bet, type: 'loss', description: `Dice Roll Loss (Sum: ${totalSum})`});
            } else {
                let multiplier = (totalSum - 12) + 1; // 12=1x, 13=2x, 18=7x
                let wonAmount = bet * multiplier;
                
                db.collection("users").doc(currentUser.uid).update({ balance: balance + wonAmount });
                
                resultMsg.innerText = `Sum: ${totalSum}. WIN ${multiplier}x (+৳${wonAmount})`;
                resultMsg.className = "result-msg win-text";
                playAudio(winSound);
                status = "win";
                historyText = `<b>Sum: ${totalSum}</b> | Bet: ৳${bet} | <span style="color:#2ecc71;">Won ৳${wonAmount}</span>`;
            }
            
            // Add to UI History
            let li = document.createElement('li');
            li.className = `history-item ${status}`;
            li.innerHTML = historyText;
            historyList.prepend(li);
            if(historyList.children.length > 30) historyList.lastChild.remove();

            setTimeout(() => {
                isRolling = false;
                document.getElementById('rollButton').disabled = false;
            }, 1000);
        }

// ==========================================
    // MOBILE BACK BUTTON FIX
    // ==========================================
    window.history.pushState(null, null, window.location.href);
    window.addEventListener('popstate', function(event) {
        window.location.replace('index.html');
    });
    </script>
</body>
</html>
