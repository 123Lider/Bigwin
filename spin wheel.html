        function initAudio() {

            if (!isSoundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(850, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);

            const rightAngle = -Math.PI / 3;
            const leftAngle = -Math.PI * 2 / 3;
            
            const rightX = centerX + radius * Math.cos(rightAngle);
            const rightY = centerY + radius * Math.sin(rightAngle);
            const leftX = centerX + radius * Math.cos(leftAngle);
            const leftY = centerY + radius * Math.sin(leftAngle);
            
            ctx.lineTo(rightX, rightY);
            ctx.arc(centerX, centerY, radius, rightAngle, leftAngle, false);
            ctx.lineTo(leftX, leftY);
            ctx.closePath();
            
            if (fillColor) {
                ctx.fillStyle = fillColor;
                ctx.fill();
            }
            if (strokeColor && strokeWidth) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = strokeWidth;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawWheel() {
            const centerX = 400;
            const centerY = 400;
            const radius = 370;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 10, 0, 2 * Math.PI);
            ctx.fillStyle = "#1e293b";
            ctx.shadowColor = "rgba(99, 102, 241, 0.45)";
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            const multiplier = currentBet / 50;

            for (let i = 0; i < numSegments; i++) {
                const seg = segments[i];
                const startAngle = i * segmentAngle + currentAngle;
                const endAngle = startAngle + segmentAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = seg.color;
                ctx.fill();

                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + segmentAngle / 2);
                
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = seg.textCol;
                
                ctx.font = "bold 20px 'Segoe UI', Arial, sans-serif";
                
                const displayVal = Math.round(seg.baseValue * multiplier);
                ctx.fillText(displayVal.toLocaleString(), radius - 20, 0);
                ctx.restore();
            }

            const numLEDs = 48;
            for (let i = 0; i < numLEDs; i++) {
                const ledAngle = i * (Math.PI * 2 / numLEDs) + (currentAngle * 0.15);
                const ledX = centerX + Math.cos(ledAngle) * (radius + 5);
                const ledY = centerY + Math.sin(ledAngle) * (radius + 5);
                
                ctx.beginPath();
                ctx.arc(ledX, ledY, 3.5, 0, 2 * Math.PI);
                
                if (Math.floor(Date.now() / 250) % 2 === i % 2) {
                    ctx.fillStyle = "#ffeb3b";
                } else {
                    ctx.fillStyle = "#ff9800";
                }
                ctx.fill();
            }

            drawTeardropPointer(centerX, centerY, 86, 42, "#FFFFFF", null, null);
            drawTeardropPointer(centerX, centerY, 80, 38, "#111111", null, null);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 32px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Spin", centerX, centerY);
        }

        // Realtime secure database-oriented Spin initiation
        async function startSpin() {
            if (isSpinning || !currentUser) return;

            initAudio();

            // ১. লাইভ ডেটাবেজ থেকে ব্যালেন্স চেক এবং ব্যালেন্স লক করা
            const userRef = db.collection("users").doc(currentUser.uid);
            try {
                const userSnap = await userRef.get();
                if (!userSnap.exists) return showToast("User not found!");
                
                const currentBalance = parseFloat(userSnap.data().balance) || 0;
                if (currentBalance < currentBet) {
                    showToast("ব্যালেন্স অপর্যাপ্ত!");
                    return;
                }

                // ২. ব্যালেন্স কাটা (Firestore-এ আপডেট)
                await userRef.update({ balance: currentBalance - currentBet });
            } catch (err) {
                console.error(err);
                showToast("Error processing bet!");
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;

            const startTime = performance.now();
            const duration = 6000;
            const startRotation = currentAngle;
            
            const extraRotations = 12 + Math.random() * 4;
            const endRotation = startRotation + (extraRotations * Math.PI * 2);

            let lastSegmentIdx = -1;

            function animate(timestamp) {
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const ease = 1 - Math.pow(1 - progress, 5);
                currentAngle = startRotation + (endRotation - startRotation) * ease;
                
                const currentMappedIndex = Math.floor(((1.5 * Math.PI - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) / segmentAngle);
                if (currentMappedIndex !== lastSegmentIdx) {
                    playTickSound();
                    lastSegmentIdx = currentMappedIndex;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    currentAngle = currentAngle % (Math.PI * 2);
                    calculateResult();
                }
            }

            requestAnimationFrame(animate);
        }

        // Calculate Result and update database
        async function calculateResult() {
            const pointerAngle = 1.5 * Math.PI;
            let winningAngle = (pointerAngle - currentAngle) % (2 * Math.PI);
            if (winningAngle < 0) {
                winningAngle += 2 * Math.PI;
            }

            const winningIndex = Math.floor(winningAngle / segmentAngle);
            const winner = segments[winningIndex];

            const multiplier = currentBet / 50;
            const prizeAmount = Math.round(winner.baseValue * multiplier);

            try {
                const userRef = db.collection("users").doc(currentUser.uid);
                const userSnap = await userRef.get();
                const currentBalance = parseFloat(userSnap.data().balance) || 0;

                // নতুন ব্যালেন্স জমা করা
                await userRef.update({ balance: currentBalance + prizeAmount });

                // হিস্ট্রি সংরক্ষণের জন্য গেম হিস্ট্রি ডেটাবেজে অ্যাড করা
                await db.collection("game_history").add({
                    uid: currentUser.uid,
                    game: "Spin Wheel",
                    betAmount: currentBet,
                    amount: prizeAmount,
                    time: Date.now()
                });

                // হিস্ট্রি রি-লোড করা
                loadHistoryData();

            } catch (err) {
                console.error("Database update error: ", err);
                showToast("Failed to process win in database!");
            }

            lastWin = prizeAmount;
            playWinSound();
            showWinDisplay(prizeAmount);
        }

        function updateClock() {
            const now = new Date();
            const options = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            };
            document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('en-US', options);
        }

        // Real Firestore History Downloader
        function loadHistoryData() {
            if (!currentUser) return;
            
            db.collection("game_history")
              .where("uid", "==", currentUser.uid)
              .get()
              .then(snap => {
                  let rawRecords = [];
                  snap.forEach(doc => {
                      const data = doc.data();
                      if (data.game === "Spin Wheel") {
                          rawRecords.push(data);
                      }
                  });

                  // ইন-মেমোরি সর্ট (ফায়ারবেস ইনডেক্সিং এরর এড়াতে)
                  rawRecords.sort((a, b) => b.time - a.time);

                  historyArray = rawRecords.slice(0, 50).map(data => {
                      const dateObj = new Date(data.time);
                      const timeStr = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short' }) + " " + dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                      return {
                          time: timeStr,
                          bet: data.betAmount || 50,
                          win: data.amount
                      };
                  });
              })
              .catch(err => console.error("Error loading history: ", err));
        }

        function showWinDisplay(amount) {
            winDisplay.textContent = `+${amount.toLocaleString()} TK`;
            winDisplay.classList.add('active');
            setTimeout(() => {
                winDisplay.classList.remove('active');
            }, 3000);
        }

        function renderHistoryTable() {
            historyTableBody.innerHTML = '';
            if (historyArray.length === 0) {
                historyTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding:20px;">No spin records yet.</td></tr>`;
                return;
            }
            historyArray.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.time}</td>
                    <td>${item.bet.toLocaleString()} TK</td>
                    <td class="history-win">${item.win.toLocaleString()} TK</td>
                `;
                historyTableBody.appendChild(tr);
            });
        }

        function updateUI() {
            balanceVal.textContent = `${balance.toFixed(2)} TK`;
            betDisplay.textContent = `${currentBet.toLocaleString()} TK`;
        }

        function showToast(msg) {
            const toastEl = document.getElementById('toast');
            if(msg) toastEl.innerText = msg;
            toastEl.classList.add('active');
            setTimeout(() => {
                toastEl.classList.remove('active');
            }, 3000);
        }

        // Event Listeners for Bet adjustments
        betPlusBtn.addEventListener('click', () => {
            if (isSpinning) return;
            currentBet += 50;
            updateUI();
            drawWheel();
        });

        betMinusBtn.addEventListener('click', () => {
            if (isSpinning) return;
            if (currentBet > 50) {
                currentBet -= 50;
                updateUI();
                drawWheel();
            }
        });

        // Menu Toggle Controls
        menuToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            dropdownMenu.classList.remove('active');
        });

        // Sound Toggle
        soundToggleBtn.addEventListener('click', () => {
            isSoundEnabled = !isSoundEnabled;
            soundToggleBtn.textContent = isSoundEnabled ? "🔊 Sound: On" : "🔇 Sound: Off";
        });

        // History Modal
        historyBtn.addEventListener('click', () => {
            renderHistoryTable();
            historyModal.classList.add('active');
        });

        closeHistoryBtn.addEventListener('click', () => {
            historyModal.classList.remove('active');
        });

        // Redirect to main wallet page with Deposit tab
        rechargeBtn.addEventListener('click', () => {
            window.location.href = 'wallet.html?tab=deposit';
        });

        spinBtn.addEventListener('click', startSpin);
        canvas.addEventListener('click', startSpin);

        // Initial Boot
        drawWheel();
        updateUI();
        
        setInterval(updateClock, 1000);
        updateClock();

        setInterval(() => {
            if (!isSpinning) {
                drawWheel();
            }
        }, 100);

// ==========================================
    // MOBILE BACK BUTTON FIX
    // ==========================================
    window.history.pushState(null, null, window.location.href);
    window.addEventListener('popstate', function(event) {
        window.location.replace('index.html');
    });
    </script>
</body>
