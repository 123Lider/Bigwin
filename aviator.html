<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator  Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; user-select: none; }
        body { background-color: #000; color: white; -webkit-tap-highlight-color: transparent; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
        
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 350px; pointer-events: none; }
        .toast { background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.6); border-left: 4px solid transparent; animation: slideDown 0.3s ease-out forwards; }
        .toast.error { border-left-color: #e61d3f; color: #ff6b81; }
        .toast.success { border-left-color: #28a745; color: #7bed9f; }
        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; background: #1a1a1f; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; height: 50px; }
        .back-btn { color: #fff; text-decoration: none; font-size: 16px; background: #222; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #444; }
        .logo-text { font-family: 'Georgia', serif; font-style: italic; font-weight: 900; font-size: 22px; color: #e61d3f; letter-spacing: -1px; }
        .right-header { display: flex; align-items: center; gap: 10px; }
        .balance { font-size: 16px; font-weight: 900; color: #28a745; display: flex; align-items: center; gap: 5px; background: #111; padding: 4px 10px; border-radius: 20px; border: 1px solid #333;}
        .menu-btn { font-size: 20px; color: #aaa; cursor: pointer; padding: 5px; }

        .side-menu { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: #1a1a1f; z-index: 1000; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.5); border-left: 1px solid #333; display: flex; flex-direction: column; }
        .side-menu.open { right: 0; }
        .menu-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #e61d3f; font-size: 18px; }
        .close-menu { font-size: 24px; color: #aaa; cursor: pointer; }
        .menu-item { padding: 15px; border-bottom: 1px solid #222; font-size: 14px; font-weight: bold; cursor: pointer; color: #ddd; display: flex; justify-content: space-between; align-items: center; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; display: none; }

        .scrollable-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .scrollable-body::-webkit-scrollbar { display: none; }

        .history-bar { display: flex; align-items: center; padding: 6px 15px; background: #121216; overflow-x: auto; gap: 8px; border-bottom: 1px solid #222; flex-shrink: 0; height: 35px; }
        .history-bar::-webkit-scrollbar { display: none; }
        .hist-val { font-size: 13px; font-weight: bold; background: #1a1a1f; padding: 2px 8px; border-radius: 10px; border: 1px solid #333; flex-shrink: 0; }
        .c-blue { color: #34b4ff; } .c-purple { color: #b185fa; } .c-pink { color: #e61d3f; }

        .game-area { width: 100%; height: 280px; position: relative; background: #1a1b20; overflow: hidden; flex-shrink: 0; border-radius: 0 0 15px 15px; border-bottom: 2px solid #e61d3f; }
        .bg-rays { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: repeating-conic-gradient(from 0deg, #18191e 0deg 10deg, #14151a 10deg 20deg); animation: rotateRays 100s linear infinite; }
        @keyframes rotateRays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        
        .waiting-layer { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.4);}
        .ufc-brand .ufc-logo { font-size: 30px; font-style: italic; font-weight: 900; color: #e61d3f; line-height: 1; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.8);}
        .wait-loader { width: 180px; height: 8px; background: #333; border-radius: 4px; margin-top: 15px; overflow: hidden; border: 1px solid #555; }
        .wait-loader .fill { width: 0%; height: 100%; background: #e61d3f; box-shadow: 0 0 10px #e61d3f; }

        .multiplier { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; font-weight: 900; color: white; z-index: 4; text-shadow: 0 5px 15px rgba(0,0,0,0.8); display: none; }
        .flew-text { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); color: #e61d3f; font-size: 24px; font-weight: 900; text-transform: uppercase; z-index: 4; display: none; text-shadow: 0 2px 5px #000; letter-spacing: 1px; }

        .plane-wrapper { position: absolute; bottom: 0; left: 0; z-index: 5; width: 140px; height: 60px; filter: drop-shadow(0 15px 10px rgba(230,29,63,0.4)); display: none; opacity: 1; }
        .propeller { transform-origin: 20px 38px; animation: spin 0.03s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .bet-controls { display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #000; flex-shrink: 0; }
        @media (min-width: 768px) { .bet-controls { flex-direction: row; } }
        .panel { flex: 1; background: #222328; border-radius: 10px; padding: 10px; border: 1px solid #2f3037; position: relative; }
        
        .panel-grid { display: grid; grid-template-columns: 1fr 140px; gap: 10px; height: 100%; }
        .controls { display: flex; flex-direction: column; justify-content: space-between; }
        .input-box { display: flex; justify-content: space-between; align-items: center; background: #000; border-radius: 8px; padding: 4px; border: 1px solid #444; }
        .circle-btn { width: 30px; height: 30px; border-radius: 5px; background: #2f3037; color: white; font-size: 20px; border: none; cursor: pointer; }
        .input-box input { background: transparent; border: none; color: white; font-size: 18px; font-weight: bold; text-align: center; width: 100%; outline: none; }
        
        .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
  .chips{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
}

.chip{
    background: black;
    color: white;

    border: 2px solid #555;   /* border mota */
    border-radius: 8px;

    padding: 4px 0;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
    
    height: 100%;
    width: 100%;
    min-width: 0;

    white-space: nowrap;      /* text 1 line */
    overflow: hidden;
    text-overflow: ellipsis;
}
        .big-btn { border-radius: 10px; border: none; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; height: 100%; box-shadow: 0 4px 0 rgba(0,0,0,0.4); transition: transform 0.1s; min-height: 70px; }
        .big-btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-green { background: linear-gradient(180deg, #28a745 0%, #1e7e34 100%); color: white; }
        .btn-red { background: linear-gradient(, #cb2027 0%, #901319 100%); color: white; }
        .btn-orange { background: linear-gradient(180deg, #d97d0d 0%, #a65e07 100%); color: white; }
        
        .big-btn .b-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
        .big-btn .b-sub { font-size: 12px; font-weight: bold; }

        .win-popup { position: absolute; font-size: 24px; font-weight: 900; color: #28a745; text-shadow: 0 2px 10px rgba(0,0,0,0.8); z-index: 100; animation: floatUp 1.2s ease-out forwards; pointer-events: none; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(1.5); opacity: 0; } }

        .live-bets-section { display: flex; flex-direction: column; background: #121212; border-top: 1px solid #222; flex: 1; min-height: 250px; }
        .live-header { display: flex; justify-content: space-between; padding: 10px; background: #1a1a1f; border-bottom: 1px solid #222; font-size: 12px; color: #aaa; font-weight: bold; }
        .bets-list { flex: 1; overflow-y: auto; padding: 5px; }
        .bets-list::-webkit-scrollbar { width: 4px; }
        .bets-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        
        .b-row { display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 6px 10px; background: #1a1a1f; margin-bottom: 4px; border-radius: 5px; font-size: 12px; align-items: center; border: 1px solid transparent; }
        .b-user { display: flexp; align-items: center; gap: 5px; color: #ccc; }
        .b-bet { font-weight: bold; color: white; text-align: center; }
        .b-win { text-align: right; font-weight: bold; }

        #pageLoader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .loader-text { color: #e61d3f; font-size: 24px; font-weight: 900; font-style: italic; margin-bottom: 10px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(230,29,63,0.3); border-top: 4px solid #e61d3f; border-radius: 50%; animation: spinLoader 1s linear infinite; }
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<audio id="sfx-fly" src="https://cdn.pixabay.com/audio/2022/10/24/audio_338a0f5e13.mp3" loop></audio>
<audio id="sfx-cash" src="https://cdn.pixabay.com/audio/2021/08/04/audio_0625c1539c.mp3"></audio>
<audio id="sfx-crash" src="https://cdn.pixabay.com/audio/2022/03/15/audio_24921ea2f2.mp3"></audio>

<div id="pageLoader">
    <div class="loader-text">LOADING AVIATOR...</div>
    <div class="spinner"></div>
</div>

<div id="toast-container"></div>

<div class="app-container">
    <div class="header">
        <div class="back-btn" onclick="window.location.replace('index.html')">←</div>
        <div class="logo-text">Aviator</div>
        <div class="right-header">
            <div class="balance"><span style="color:#fff;">৳</span><span id="balText">0.00</span></div>
            <i class="fa-solid fa-bars menu-btn" onclick="toggleMenu()"></i>
        </div>
    </div>

    <div class="scrollable-body">
        <div class="history-bar" id="historyBar"><span style="color:#666; font-size:12px; margin:auto;">Syncing live rounds...</span></div>

        <div class="game-area">
            <div class="bg-rays"></div>
            <canvas id="gameCanvas"></canvas>
            
            <div class="waiting-layer" id="waitScreen">
                <div class="ufc-brand">
                    <div class="ufc-logo">Aviator</div>
                    <div style="font-size:10px; color:#aaa; letter-spacing:2px; margin-top:5px;" id="waitSubText">WAITING FOR NEXT ROUND</div>
                </div>
                <div class="wait-loader"><div class="fill" id="waitBar"></div></div>
            </div>

            <div class="flew-text" id="flewText">FLEW AWAY!</div>
            <div class="multiplier" id="multiplierText">1.00x</div>

            <div class="plane-wrapper" id="planeObj">
                <svg viewBox="0 0 150 60" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                    <path d="M -20,40 Q 30,50 60,35 L 60,40 Q 30,55 -20,45 Z" fill="rgba(255,255,255,0.3)"/>
                    <path d="M 20,35 Q 30,25 90,25 L 120,28 Q 135,32 135,38 Q 135,45 110,45 L 30,45 Q 15,45 20,35 Z" fill="#e61d3f"/>
                    <path d="M 50,26 L 80,5 L 100,26 Z" fill="#b01630"/>
                    <path d="M 50,45 L 75,60 L 95,45 Z" fill="#b01630"/>
                    <path d="M 110,27 L 135,15 L 135,30 Z" fill="#e61d3f"/>
                    <path d="M 110,45 L 135,55 L 135,40 Z" fill="#e61d3f"/>
                    <g class="propeller"><ellipse cx="20" cy="38" rx="3" ry="18" fill="#fff" opacity="0.9"/></g>
                </svg>
            </div>
        </div>

        <div class="bet-controls">
            <div class="panel" id="panel1">
                <div class="panel-grid">
                    <div class="controls">
                        <div class="input-box">
                            <button class="circle-btn" onclick="adjBet(1, -10)">−</button>
                            <input type="number" id="inp1" value="10" readonly>
                            <button class="circle-btn" onclick="adjBet(1, 10)">+</button>
                        </div>
                        <div class="chips">
                            <button class="chip" onclick="setBet(1, 100)">100</button>
                            <button class="chip" onclick="setBet(1, 500)">500</button>
                            <button class="chip" onclick="setBet(1, 1000)">1k</button>
                            <button class="chip" onclick="setBet(1, 5000)">5k</button>
                        </div>
                    </div>
                    <button class="big-btn btn-green" id="btn1" onclick="action(1)"><span class="b-title" id="btit1">BET</span><span class="b-sub" id="bsub1">10.00 BDT</span></button>
                </div>
            </div>

            <div class="panel" id="panel2">
                <div class="panel-grid">
                    <div class="controls">
                        <div class="input-box">
                            <button class="circle-btn" onclick="adjBet(2, -10)">−</button>
                            <input type="number" id="inp2" value="20" readonly>
                            <button class="circle-btn" onclick="adjBet(2, 10)">+</button>
                        </div>
                        <div class="chips">
                            <button class="chip" onclick="setBet(2, 100)">100</button>
                            <button class="chip" onclick="setBet(2, 500)">500</button>
                            <button class="chip" onclick="setBet(2, 1000)">1k</button>
                            <button class="chip" onclick="setBet(2, 5000)">5k</button>
                        </div>
                    </div>
                    <button class="big-btn btn-green" id="btn2" onclick="action(2)"><span class="b-title" id="btit2">BET</span><span class="b-sub" id="bsub2">20.00 BDT</span></button>
                </div>
            </div>
        </div>

        <div class="live-bets-section">
            <div class="live-header"><div>ALL BETS <span id="totPlayers" style="color:white;font-weight:bold;margin-left:5px">0</span></div></div>
            <div class="bets-list" id="betsListArea"></div>
        </div>
    </div>
</div>

<div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-header">MENU <i class="fa-solid fa-xmark close-menu" onclick="toggleMenu()"></i></div>
    <div class="menu-item" onclick="toggleSound()">
        <span><i class="fa-solid fa-volume-high"></i> Sound Effect</span>
        <span id="soundStatus" style="color:#ff4d4d">OFF</span>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyB2Gv7FXkDP5AJEm2MrZBEin6rN8YZwnK8", authDomain: "betbd-be722.firebaseapp.com", projectId: "betbd-be722" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();

    let currentUser = null, balance = 0, state = 'init', mult = 1.00, stTime = 0, gameLoopRef = null, liveGameData = {};
    let soundOn = false, localCrashTriggered = false, isFirstLoad = true;

    const aFly = document.getElementById('sfx-fly'), aCash = document.getElementById('sfx-cash'), aCrash = document.getElementById('sfx-crash');
    const cvs = document.getElementById('gameCanvas'), ctx = cvs.getContext('2d'), plane = document.getElementById('planeObj'), multText = document.getElementById('multiplierText'), waitScr = document.getElementById('waitScreen'), waitBar = document.getElementById('waitBar'), flewText = document.getElementById('flewText'), histBar = document.getElementById('historyBar');

    function showToast(msg, type = 'error') { const cont = document.getElementById('toast-container'), t = document.createElement('div'); t.className = `toast ${type}`; t.innerHTML = `${type === 'error' ? '<i class="fa-solid fa-circle-exclamation"></i>' : '<i class="fa-solid fa-circle-check"></i>'} <span>${msg}</span>`; cont.appendChild(t); setTimeout(() => t.remove(), 2500); }
    function toggleMenu() { const m = document.getElementById('sideMenu'), o = document.getElementById('menuOverlay'); m.classList.toggle('open'); o.style.display = m.classList.contains('open') ? 'block' : 'none'; }
    function toggleSound() { soundOn = !soundOn; document.getElementById('soundStatus').innerText = soundOn ? "ON" : "OFF"; document.getElementById('soundStatus').style.color = soundOn ? "#4cd137" : "#ff4d4d"; }
    function playSfx(type) { if(!soundOn) return; if(type === 'fly') { aFly.currentTime=0; aFly.play().catch(()=>{}); } if(type === 'cash') { aCash.currentTime=0; aCash.play().catch(()=>{}); } if(type === 'crash') { aFly.pause(); aCrash.currentTime=0; aCrash.play().catch(()=>{}); } if(type === 'stop') { aFly.pause(); } }

    // Fast loading Fix: Hide loader after max 2 seconds even if connection is slow
    setTimeout(() => { document.getElementById('pageLoader').style.display = 'none'; }, 2000);

    auth.onAuthStateChanged(user => {
        if(user) {
            currentUser = user;
            db.collection("users").doc(user.uid).onSnapshot(doc => { if(doc.exists) { balance = doc.data().balance; document.getElementById('balText').innerText = balance.toFixed(2); } });
        } else window.location.href = 'index.html';
    });

    window.addEventListener('resize', ()=> { cvs.width = cvs.parentElement.clientWidth; cvs.height = cvs.parentElement.clientHeight; }); 
    cvs.width = cvs.parentElement.clientWidth; cvs.height = cvs.parentElement.clientHeight;

    let pData = { 1: { state: 'idle', amt: 10, nextReady: false }, 2: { state: 'idle', amt: 20, nextReady: false } };
    function setBet(id, v) { if(pData[id].state === 'idle') { pData[id].amt = v; document.getElementById(`inp${id}`).value = v; document.getElementById(`bsub${id}`).innerText = v.toFixed(2) + " BDT"; } }
    function adjBet(id, d) { let v = pData[id].amt + d; if(v < 10) return showToast("Minimum bet is 10 BDT!", "error"); if(v > 10000) return showToast("Maximum bet is 10,000 BDT!", "error"); setBet(id, v); }

    function updateBtnUI(id) {
        let btn = document.getElementById(`btn${id}`), t = document.getElementById(`btit${id}`), s = document.getElementById(`bsub${id}`), d = pData[id];
        if(d.nextReady) { btn.className = 'big-btn btn-red'; t.innerText = 'CANCEL'; s.innerText = 'WAITING FOR NEXT'; } 
        else if(d.state === 'idle') { btn.className = 'big-btn btn-green'; t.innerText = 'BET'; s.innerText = d.amt.toFixed(2) + " BDT"; } 
        else if (d.state === 'play') { btn.className = 'big-btn btn-orange'; t.innerText = 'CASH OUT'; s.innerText = (d.amt * mult).toFixed(2) + ' BDT'; }
    }

    function showWinAnim(amt, id) {
        let el = document.createElement('div'); el.className = 'win-popup'; el.innerText = '+৳' + amt.toFixed(2);
        document.getElementById(`panel${id}`).appendChild(el); el.style.left = '50%'; el.style.top = '10%'; el.style.transform = 'translateX(-50%)';
        setTimeout(()=>el.remove(), 1200);
    }

    function action(id) {
        let d = pData[id];
        if (state === 'wait' || state === 'crash') {
            if (d.state === 'idle' && !d.nextReady) {
                if(balance < d.amt) return showToast("Insufficient Balance!", "error");
                db.collection("users").doc(currentUser.uid).update({ balance: balance - d.amt }); d.nextReady = true; updateBtnUI(id);
            } else if (d.nextReady) {
                db.collection("users").doc(currentUser.uid).update({ balance: balance + d.amt }); d.nextReady = false; updateBtnUI(id);
            }
        } else if (state === 'fly') {
            if (d.state === 'play') { 
                d.winAmt = d.amt * mult; db.collection("users").doc(currentUser.uid).update({ balance: balance + d.winAmt });
                d.state = 'idle'; showWinAnim(d.winAmt, id); playSfx('cash'); updateBtnUI(id); 
            } else if (d.state === 'idle' && !d.nextReady) { 
                if(balance < d.amt) return showToast("Insufficient Balance!", "error");
                db.collection("users").doc(currentUser.uid).update({ balance: balance - d.amt }); d.nextReady = true; updateBtnUI(id); 
            } else if (d.nextReady) { 
                db.collection("users").doc(currentUser.uid).update({ balance: balance + d.amt }); d.nextReady = false; updateBtnUI(id);
            }
        }
    }

    let waitBarFrame;
    function smoothWaitBar() {
        if(state !== 'wait' || !liveGameData.startTime) return;
        let pct = ((Date.now() - liveGameData.startTime) / 5000) * 100;
        waitBar.style.width = (pct > 100 ? 100 : pct) + '%';
        waitBarFrame = requestAnimationFrame(smoothWaitBar);
    }

    function triggerClientCrash(crashMultValue) {
        if (localCrashTriggered) return;
        localCrashTriggered = true; state = 'crash'; mult = crashMultValue;
        if(gameLoopRef) cancelAnimationFrame(gameLoopRef);
        
        multText.innerText = parseFloat(mult).toFixed(2) + "x"; multText.style.color = '#e61d3f'; flewText.style.display = 'block';
        plane.style.transition = 'transform 0.3s ease-in, opacity 0.2s'; plane.style.transform += ' translate(300px, -200px)'; plane.style.opacity = '0';
        playSfx('crash');
        
        let sp = document.createElement('span'); sp.className = `hist-val ${mult<2?'c-blue':(mult>10?'c-pink':'c-purple')}`; sp.innerText = parseFloat(mult).toFixed(2)+"x"; histBar.insertBefore(sp, histBar.firstChild); if(histBar.children.length > 20) histBar.lastChild.remove();
        [1,2].forEach(id => { if(pData[id].state === 'play') { pData[id].state = 'idle'; updateBtnUI(id); } });
    }

    // Engine Sync
    db.collection("games").doc("aviator").onSnapshot(doc => {
        if (!doc.exists) return;
        let data = doc.data(); liveGameData = data;
        
        document.getElementById('pageLoader').style.display = 'none';

        if(data.state === 'wait') {
            isFirstLoad = false;
            if(state !== 'wait') {
                state = 'wait'; localCrashTriggered = false;
                ctx.clearRect(0,0,cvs.width,cvs.height); 
                plane.style.display = 'none'; plane.style.opacity = '1'; plane.style.transition = 'none'; plane.style.transform = 'translate(0,0)';
                multText.style.display = 'none'; flewText.style.display = 'none'; waitScr.style.display = 'flex'; playSfx('stop');
                
                if(waitBarFrame) cancelAnimationFrame(waitBarFrame); smoothWaitBar();
                [1,2].forEach(id => { if(pData[id].nextReady) { pData[id].state = 'play'; pData[id].nextReady = false; } else { pData[id].state = 'idle'; } updateBtnUI(id); });
                generateBots();
            }
        } 
        else if(data.state === 'fly') {
            isFirstLoad = false;
            let target = parseFloat(data.crashMult) || 1.00;
            let flyTimeMs = (((-0.05 + Math.sqrt(0.0025 - 4*0.01*(1 - target))) / 0.02) * 1000);
            
            if(Date.now() - data.startTime >= flyTimeMs) {
                if(!localCrashTriggered) triggerClientCrash(target); return;
            }

            if(state !== 'fly') {
                state = 'fly'; stTime = data.startTime; localCrashTriggered = false;
                waitScr.style.display = 'none'; multText.style.display = 'block'; multText.style.color = 'white'; 
                plane.style.display = 'block'; plane.style.opacity = '1'; playSfx('fly');
                [1,2].forEach(id => { updateBtnUI(id); });
                if(gameLoopRef) cancelAnimationFrame(gameLoopRef); loop();
            }
        } 
        else if(data.state === 'crash') {
            if(isFirstLoad) {
                // If user enters app late during crash, skip glitchy animations and just show the crashed screen directly
                state = 'crash'; localCrashTriggered = true; isFirstLoad = false;
                waitScr.style.display = 'none'; plane.style.display = 'none';
                multText.style.display = 'block'; multText.style.color = '#e61d3f'; multText.innerText = parseFloat(data.crashMult).toFixed(2) + "x";
                flewText.style.display = 'block';
            } else if(!localCrashTriggered) {
                triggerClientCrash(parseFloat(data.crashMult));
            }
        }
    });

    function loop() {
        if(state !== 'fly') return; 
        let time = (Date.now() - stTime) / 1000; 
        let currentMult = 1 + (time * 0.05) + Math.pow(time, 2) * 0.01; 
        
        if(liveGameData.crashMult && currentMult >= parseFloat(liveGameData.crashMult)) { triggerClientCrash(parseFloat(liveGameData.crashMult)); return; }
        
        mult = currentMult; multText.innerText = mult.toFixed(2) + "x";
        ctx.clearRect(0, 0, cvs.width, cvs.height); 
        let cX = Math.min(time * (cvs.width*0.7/5), cvs.width*0.7), cY = Math.min(time * (cvs.height*0.6/5), cvs.height*0.6);
        ctx.beginPath(); ctx.moveTo(0, cvs.height); ctx.quadraticCurveTo(cX*0.5, cvs.height, cX, cvs.height - cY + 25); ctx.strokeStyle = '#e61d3f'; ctx.lineWidth = 4; ctx.stroke(); 
        plane.style.transform = `translate(${cX}px, -${cY}px)`;
        
        processBots(mult); [1,2].forEach(id => { if(pData[id].state === 'play') updateBtnUI(id); }); 
        gameLoopRef = requestAnimationFrame(loop);
    }

    let bots = [], botPool = ["Boss**","King**","Sakib**","Mafi**","Hero**","ProBD**","Nirob**","Rana**","Akash**","Lio**","Max**","John**","Raju**","Alif**"];
    function generateBots() { bots = []; botPool.sort(()=>0.5-Math.random()); let count = Math.floor(Math.random()*5)+15; for(let i=0; i<count; i++) { bots.push({ name: botPool[i%botPool.length], amt: [10,20,50,100,200,500,1000][Math.floor(Math.random()*7)], target: (Math.random()*5)+1.1, cashed: false }); } updateBotsUI(); }
    function processBots(m) { let changed = false; bots.forEach(b => { if(!b.cashed && m >= b.target) { b.cashed = true; changed = true; } }); if(changed) updateBotsUI(); }
    function updateBotsUI() { let sorted = [...bots].sort((a,b) => (b.cashed===a.cashed) ? b.amt-a.amt : (a.cashed?-1:1)); let html = ''; sorted.slice(0, 10).forEach(b => { html += `<div class="b-row"><div class="b-user">${b.name}</div><div class="b-bet">৳${b.amt}</div><div class="b-win">${b.cashed?`<span class="text-green-500">${b.target.toFixed(2)}x</span>`:'--'}</div></div>`; }); document.getElementById('betsListArea').innerHTML = html; document.getElementById('totPlayers').innerText = bots.length; }

// ==========================================
    // MOBILE BACK BUTTON FIX
    // ==========================================
    window.history.pushState(null, null, window.location.href);
    window.addEventListener('popstate', function(event) {
        window.location.replace('index.html');
    });
</script>
