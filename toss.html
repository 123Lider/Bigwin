<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOSS GAME</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 50%, #000000 100%); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Loader */
        #pageLoader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; color: #ffcc00; font-size: 24px; font-weight: 800; font-family: 'Orbitron', sans-serif; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0, 0, 0, 0.6); border-bottom: 1px solid rgba(255, 204, 0, 0.3); backdrop-filter: blur(10px); z-index: 20; height: 60px; }
        .back-btn { color: #ffcc00; text-decoration: none; font-size: 18px; background: #222; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #555; }
        .logo-text { font-weight: 800; font-size: 20px; color: #fff; letter-spacing: 1px; }
        .right-header { display: flex; align-items: center; gap: 15px; }
        .account-info { font-size: 16px; font-weight: 800; background: linear-gradient(90deg, #00b09b, #96c93d); padding: 5px 15px; border-radius: 30px; box-shadow: 0 0 10px rgba(0, 176, 155, 0.5); font-family: 'Orbitron', sans-serif; display: flex; align-items: center; gap: 5px; }
        .menu-btn { font-size: 22px; color: #ffcc00; cursor: pointer; padding: 5px; }

        /* Side Menu */
        .side-menu { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: #1a1a2e; z-index: 1000; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.8); border-left: 1px solid #333; display: flex; flex-direction: column; }
        .side-menu.open { right: 0; }
        .menu-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #ffcc00; font-size: 18px; }
        .close-menu { font-size: 24px; color: #aaa; cursor: pointer; }
        .menu-item { padding: 15px; border-bottom: 1px solid #222; font-size: 14px; font-weight: bold; cursor: pointer; color: #ddd; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .menu-item:hover { background: #0f0f1a; color: #fff; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; }

        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 10px; }
        .modal-content { background: #1a1a2e; width: 100%; max-width: 400px; border-radius: 15px; border: 1px solid #ffcc00; display: flex; flex-direction: column; max-height: 80vh; }
        .modal-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; font-weight: bold; color: #ffcc00; }
        .modal-body { padding: 10px; overflow-y: auto; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #333; }
        th { color: #888; text-transform: uppercase; font-size: 11px; }

        /* Game Area - 3D Perspective */
        .game-area { flex: 1; display: flex; justify-content: center; align-items: center; perspective: 900px; perspective-origin: center; position: relative; overflow: hidden; }

        /* Timer */
        .timer-container { position: absolute; top: 20px; font-size: 14px; color: #aaa; background: rgba(0,0,0,0.6); padding: 5px 20px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 10; text-align: center; }
        #timer { font-size: 24px; color: #ffcc00; font-weight: bold; font-family: 'Orbitron', sans-serif; display: block; }
        .timer-alert { color: #ff3333 !important; text-shadow: 0 0 10px red; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Beautiful 3D Board */
        .board { width: 300px; height: 300px; background: radial-gradient(circle, #1f1f2e, #0a0a10); border-radius: 50%; transform: rotateX(60deg); transform-style: preserve-3d; box-shadow: 0 10px 0 #050505, 0 30px 40px rgba(0,0,0,0.9), inset 0 0 50px rgba(0, 150, 255, 0.2); border: 5px solid #222; position: relative; display: flex; justify-content: center; align-items: center; }
        @media(min-width: 768px) { .board { width: 400px; height: 400px; } }

        .center-ring { width: 100px; height: 100px; border-radius: 50%; border: 3px solid rgba(255, 204, 0, 0.4); box-shadow: 0 0 20px rgba(255, 204, 0, 0.3), inset 0 0 15px rgba(255, 204, 0, 0.2); position: absolute; }

        /* Coin Animations */
        .coin-jump { position: absolute; transform-style: preserve-3d; transform: translateZ(10px); transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.3, 1); }
        .coin-spin { width: 80px; height: 80px; transform-style: preserve-3d; transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .coin-face { width: 100%; height: 100%; position: absolute; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: 800; backface-visibility: hidden; border: 3px solid #e0e0e0; box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 0 5px rgba(0,0,0,0.5); letter-spacing: 1px; }
        .face-red { background: radial-gradient(circle at 30% 30%, #ff4b4b, #990000); color: #fff; transform: translateZ(6px); }
        .face-blue { background: radial-gradient(circle at 30% 30%, #4b7bff, #001166); color: #fff; transform: rotateY(180deg) translateZ(6px); }
        .coin-edge { width: 100%; height: 100%; position: absolute; border-radius: 50%; background: linear-gradient(45deg, #777, #ddd, #777); }

        /* Bottom Controls */
        .controls { background: rgba(10, 10, 15, 0.95); padding: 15px 20px 25px 20px; border-top: 1px solid #333; box-shadow: 0 -10px 25px rgba(0,0,0,0.8); z-index: 20; }
        .status-msg { text-align: center; font-size: 14px; color: #ccc; margin-bottom: 10px; height: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* Amount Selector */
        .amount-control { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        .btn-math { width: 45px; height: 45px; font-size: 24px; border-radius: 50%; background: #222; color: #fff; border: 2px solid #555; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; box-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        .btn-math:active { transform: scale(0.9); background: #444;}
        .bet-display { font-size: 24px; font-weight: bold; color: #ffcc00; background: #0a0a0a; padding: 5px 20px; border-radius: 10px; border: 2px solid #333; font-family: 'Orbitron', sans-serif; min-width: 120px; text-align: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; gap: 5px; }

        /* Action Buttons */
        .bet-buttons { display: flex; justify-content: center; gap: 15px; max-width: 500px; margin: 0 auto; }
        .btn-bet { flex: 1; padding: 15px; font-size: 20px; font-weight: 800; border: none; border-radius: 12px; color: white; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; position: relative; overflow: hidden; }
        
        .btn-red { background: linear-gradient(to bottom, #ff3333, #990000); box-shadow: 0 6px 0 #550000, 0 10px 15px rgba(255, 0, 0, 0.4); border: 1px solid #ff6666; }
        .btn-red:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 #550000, 0 5px 10px rgba(255, 0, 0, 0.4); }

        .btn-blue { background: linear-gradient(to bottom, #3366ff, #001166); box-shadow: 0 6px 0 #000044, 0 10px 15px rgba(0, 0, 255, 0.4); border: 1px solid #6699ff; }
        .btn-blue:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 #000044, 0 5px 10px rgba(0, 0, 255, 0.4); }

        .btn-bet:disabled { filter: grayscale(80%) brightness(0.6); cursor: not-allowed; transform: translateY(6px); box-shadow: none; }
    </style>
</head>
<body>

    <!-- Audio Elements -->
    <audio id="tickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
    <audio id="dropSound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>
    <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>

    <div id="pageLoader">LOADING TOSS GAME</div>

    <!-- Top Header -->
    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="logo-text">TOSS</div>
        <div class="right-header">
            <div class="account-info">৳ <span id="balance">0.00</span></div>
            <i class="fa-solid fa-bars menu-btn" onclick="toggleMenu()"></i>
        </div>
    </div>

    <!-- 3D Game Board -->
    <div class="game-area">
        <div class="timer-container">Rolling In <span id="timer">10</span></div>
        
        <div class="board">
            <div class="center-ring"></div>
            <!-- Jump animation moves the coin towards the camera (Upwards) -->
            <div class="coin-jump" id="coinJump">
                <!-- Spin animation handles 3D rotation -->
                <div class="coin-spin" id="coinSpin">
                    <div class="coin-face face-red">RED</div>
                    <div class="coin-face face-blue">BLUE</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Betting Controls -->
    <div class="controls">
        <div class="status-msg" id="statusMsg">Place your bets (Max ৳10000)</div>
        
        <div class="amount-control">
            <button class="btn-math" onclick="changeAmount(-10)">−</button>
            <div class="bet-display"><span style="color:#fff; font-size:16px;">৳</span><span id="betAmount">10</span></div>
            <button class="btn-math" onclick="changeAmount(10)">+</button>
        </div>

        <div class="bet-buttons">
            <button class="btn-bet btn-red" id="btnRed" onclick="placeBet('red')">RED</button>
            <button class="btn-bet btn-blue" id="btnBlue" onclick="placeBet('blue')">BLUE</button>
        </div>
    </div>

    <!-- Side Menu & Overlay -->
    <div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            OPTIONS <i class="fa-solid fa-xmark close-menu" onclick="toggleMenu()"></i>
        </div>
        <div class="menu-item" onclick="toggleSound()">
            <span><i class="fa-solid fa-volume-high"></i> Sound Effect</span>
            <span id="soundStatus" style="color:#ff3333">OFF</span>
        </div>
        <div class="menu-item" onclick="openHistory()">
            <span><i class="fa-solid fa-list"></i> My Bet History</span>
            <i class="fa-solid fa-chevron-right" style="color:#555"></i>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                My Bet History <i class="fa-solid fa-xmark close-modal" onclick="closeHistory()"></i>
            </div>
            <div class="modal-body">
                <table>
                    <thead><tr><th>Bet Details</th><th>Outcome</th><th>Profit/Loss</th></tr></thead>
                    <tbody id="histBody">
                        <tr><td colspan="3" style="text-align:center;">No history found</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    const firebaseConfig = { apiKey: "AIzaSyB2Gv7FXkDP5AJEm2MrZBEin6rN8YZwnK8", authDomain: "betbd-be722.firebaseapp.com", projectId: "betbd-be722" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();

    let currentUser = null, balance = 0;
    auth.onAuthStateChanged(user => {
        if(user) {
            currentUser = user;
            db.collection("users").doc(user.uid).onSnapshot(doc => { if(doc.exists) { balance = doc.data().balance; document.getElementById('balance').innerText = balance.toFixed(2); } });
            document.getElementById('pageLoader').style.display = 'none';
        } else window.location.href = 'index.html';
    });

    const coinSpin = document.getElementById('coinSpin');
    for(let i = 5; i >= -5; i--) { if(i !== 6 && i !== -6) { let edge = document.createElement('div'); edge.className = 'coin-edge'; edge.style.transform = `translateZ(${i}px)`; coinSpin.appendChild(edge); } }

    let betAmount = 10, currentBet = null, isFlipping = false, rotationX = 0, rotationY = 0, soundOn = false, liveGameData = {};

    const betAmountEl = document.getElementById('betAmount'), timerEl = document.getElementById('timer'), btnRed = document.getElementById('btnRed'), btnBlue = document.getElementById('btnBlue'), statusMsg = document.getElementById('statusMsg'), coinJump = document.getElementById('coinJump');
    const tickSound = document.getElementById('tickSound'), dropSound = document.getElementById('dropSound'), winSound = document.getElementById('winSound');

    function toggleMenu() { const m = document.getElementById('sideMenu'), o = document.getElementById('menuOverlay'); m.classList.toggle('open'); o.style.display = m.classList.contains('open') ? 'block' : 'none'; }
    function toggleSound() { soundOn = !soundOn; document.getElementById('soundStatus').innerText = soundOn ? "ON" : "OFF"; document.getElementById('soundStatus').style.color = soundOn ? "#96c93d" : "#ff3333"; }
    function playSfx(audio) { if(soundOn) { audio.currentTime = 0; audio.play().catch(()=>{}); } }
    function closeHistory() { document.getElementById('historyModal').style.display = 'none'; }

    function changeAmount(val) {
        if (isFlipping || currentBet !== null) return; 
        let newAmount = betAmount + val;
        if (newAmount >= 10 && newAmount <= 10000) { betAmount = newAmount; betAmountEl.innerText = betAmount; }
    }

    // --- NEW: SENDS LIVE BET TO FIREBASE FOR AI TO CALCULATE ---
    function placeBet(color) {
        if (isFlipping || currentBet !== null) return;
        if (balance < betAmount) return alert("Insufficient Balance!");
        
        // Deduct balance
        db.collection("users").doc(currentUser.uid).update({ balance: balance - betAmount });
        
        // Send to Live Bets for Admin to read
        db.collection("games").doc("coinflip").collection("live_bets").doc(currentUser.uid).set({
            uid: currentUser.uid,
            color: color,
            amount: betAmount,
            time: Date.now()
        });

        currentBet = color;
        statusMsg.innerText = `৳${betAmount} on ${color.toUpperCase()} Placed!`;
        statusMsg.style.color = color === 'red' ? '#ff4b4b' : '#4b7bff';
        if (color === 'red') { btnBlue.disabled = true; btnRed.innerText = "LOCKED"; } else { btnRed.disabled = true; btnBlue.innerText = "LOCKED"; }
    }

    // ====== LIVE ENGINE SYNC ======
    let timerInterval = null;

    db.collection("games").doc("coinflip").onSnapshot(doc => {
        if (!doc.exists) { return; }
        let data = doc.data(); liveGameData = data;

        if (data.state === 'wait') {
            isFlipping = false;
            btnRed.disabled = currentBet !== null && currentBet !== 'red';
            btnBlue.disabled = currentBet !== null && currentBet !== 'blue';
            if(!currentBet) { statusMsg.innerText = "Place your bets (Max ৳10000)"; statusMsg.style.color = "#ccc"; }
            
            if (timerInterval) clearInterval(timerInterval);
            
            // 15s Timer Logic
            timerInterval = setInterval(() => {
                let timeLeft = Math.ceil((data.endTime - Date.now()) / 1000);
                if (timeLeft < 0) { timeLeft = 0; btnRed.disabled = true; btnBlue.disabled = true; } // Lock buttons at 0
                
                timerEl.innerText = timeLeft;
                
                if (timeLeft <= 3 && timeLeft > 0) { timerEl.classList.add("timer-alert"); playSfx(tickSound); } 
                else { timerEl.classList.remove("timer-alert"); }
            }, 1000);
        } 
        else if (data.state === 'result') {
            if (timerInterval) clearInterval(timerInterval);
            timerEl.innerText = "0"; timerEl.classList.remove("timer-alert");
            if(!isFlipping) { startFlipAnimation(data.result); }
        }
    });

    function startFlipAnimation(result) {
        isFlipping = true; btnRed.disabled = true; btnBlue.disabled = true;
        statusMsg.innerText = "Coin is spinning..."; statusMsg.style.color = "#ffcc00";

        rotationX += (Math.floor(Math.random() * 5) + 5) * 360;
        let finalY = rotationY + (Math.floor(Math.random() * 5) + 5) * 360;
        if (result === 'blue') { finalY += 180; } else if (finalY % 360 !== 0) { finalY += 180; }
        rotationY = finalY;

        coinJump.style.transform = `translateZ(300px) scale(1.2)`; 
        coinSpin.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
        
        setTimeout(() => { coinJump.style.transform = `translateZ(10px) scale(1)`; }, 1500);
        setTimeout(() => { playSfx(dropSound); checkWin(result); }, 3000); 
    }

    function checkWin(result) {
        if (currentBet !== null) {
            if (currentBet === result) {
                let winAmount = betAmount * 1.9; // 1.9x payout
                db.collection("users").doc(currentUser.uid).update({ balance: balance + winAmount });
                statusMsg.innerText = `${result.toUpperCase()} WON! +৳${winAmount.toFixed(2)}`; statusMsg.style.color = "#96c93d"; playSfx(winSound);
            } else { statusMsg.innerText = `${result.toUpperCase()} WON! You lost ৳${betAmount}`; statusMsg.style.color = "#ff3333"; }
        } else { statusMsg.innerText = `Landed on ${result.toUpperCase()}`; statusMsg.style.color = "#fff"; }
        
        setTimeout(() => { 
            currentBet = null; 
            btnRed.innerText = "RED"; btnBlue.innerText = "BLUE"; 
            if(liveGameData.state === 'wait') {
                btnRed.disabled = false; btnBlue.disabled = false;
                statusMsg.innerText = "Place your bets (Max ৳10000)"; statusMsg.style.color = "#ccc";
            }
        }, 3000);
    }
// ==========================================
    // MOBILE BACK BUTTON FIX
    // ==========================================
    window.history.pushState(null, null, window.location.href);
    window.addEventListener('popstate', function(event) {
        window.location.replace('index.html');
    });
</script>
</body>
</html>
